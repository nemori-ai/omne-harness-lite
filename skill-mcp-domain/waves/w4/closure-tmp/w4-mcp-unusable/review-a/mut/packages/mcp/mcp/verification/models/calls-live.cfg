\* Positive control (liveness): under LiveSpec every call answers, with the peer free to drop the answer of a stopped request.
SPECIFICATION LiveSpec
CONSTANTS
  Keys = {"A"}
  Callers = {"A"}
  Invokes = 1
  Continues = 0
  Cancellers = {"A"}
  Cancels = 1
  Taskers = {}
  Tasks = 0
  Aborts = 1
  Drops = 0
  CloseAlls = 1
  Peer = "complete"
  Deviations = {"fail", "reject"}
  Budget = 1
  Bugs = {}
  Observe = FALSE
CHECK_DEADLOCK FALSE
PROPERTY
  P14_EveryCallAnswers
