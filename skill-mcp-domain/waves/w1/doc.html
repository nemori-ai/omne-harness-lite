<script>
const DOCS = {"pack": "# W1 波包：契约地基\n\n格式沿 `.meta_harness/human/map-reduce-delivery/templates/line-pack.md`，按[范式 r1](../operating-model.md) 变通：两条线合一份，没有线父卡、binding、轨道与 gate。\n\n## 1. 线与当前波\n\n| 项目 | 本次值 |\n| --- | --- |\n| 仓库、里程碑、reduce | `nemori-ai/omne-harness-lite`；边界是 M2 完结（[#784](https://github.com/nemori-ai/omne-harness-lite/issues/784)）；reduce 是本会话 |\n| 线 | Skill 线、MCP 线，线负责人都是本会话 |\n| 当前波 | W1，两条线都 active |\n| 父分支与冻结输入 F | `PanQiWei/skill-mcp`，F = `21175c9f9f05a29d1db509420b75d2b016ed2fbe`（含 w1-prep 的依赖声明与锁文件） |\n| 开波同步 | `origin/integration/mainline` = `24e5ba838`，已是父分支祖先，无需合并（2026-11-03 读回） |\n| 上下文地图 | [Skill](../line-skill/context-map.md)、[MCP](../line-mcp/context-map.md)；共用约束 [constraints.md](../constraints.md) |\n\n## 2. 两条线在 M2 完结前的目标、边界与验收\n\n- 目标：两个领域的契约、通用实现与本地宿主在替身端口上完整可用，M2 之后只需接真实提供者。见[波段计划](../rolling-plan.html)。\n- 边界：只写 `packages/skills/*` 与 `packages/mcp/*`；不接真实提供者；不进应用插件树。\n- 验收：每波出口判据有证据；组页的「归 SPEC」项全部落到成员 SPEC 或具名剩余义务。\n\n## 3. 本波交付边界\n\n### 3.1 成果与判据\n\n| 成果 | 验收判据与证据 |\n| --- | --- |\n| `@omne-harness/skill-contract` 的 W1 公开形状 | 见 [skill/spec.md](skill/spec.md) 判据 SC1–SC8 |\n| `@omne-harness/mcp-contract` 的 W1 公开形状 | 见 [mcp/spec.md](mcp/spec.md) 判据 MC1–MC8 |\n| 两份源码技术文档首版 | reduce 在两个闭包合入后重生成并发布 |\n\n### 3.2 明确不做\n\n- 应用服务的实现（`createSkillAccess`、`createMcp` 等），W2 做。\n- `SkillAccess` 的符合性套件（需要 W2 的实现来验证套件本身），W2 做。\n- `McpTransport` 的契约测试套件与真实服务端夹具，W3 做。\n- 任何官方 MCP SDK 依赖。\n- 修改组页、领域页、统一语言：只由 reduce 在波末做。\n\n### 3.3 冻结输入与写集\n\n- F：`21175c9f9f05a29d1db509420b75d2b016ed2fbe`。\n- 依赖的外部契约：`@omne-harness/assets`（`BodyContract`、`CapabilityId`、`JudgeContext`、`Declarations`、`readBodyText`、`readSnapshot`）、`@omne-harness/operation-result`、`@omne-harness/legal-identity`、`@omne-harness/json-text`、`@omne-harness/content-block`（仅 MCP），均以 F 上的版本为准。\n- 本线对外承诺的契约：两个契约成员。本波首次建立公开形状；合入后只做可加改动。\n- 写集：`w1-skill-contract` 只写 `packages/skills/skill-contract/`；`w1-mcp-contract` 只写 `packages/mcp/mcp-contract/`。两者不相交。\n- 禁写：`package.json` 的 `dependencies` 段、`pnpm-lock.yaml`、`pnpm-workspace.yaml`、组页、领域页、`.meta_harness/`。需要新依赖时停下交回。\n\n### 3.4 需负责人批复\n\n无。\n\n### 3.5 停止条件\n\n- 两个闭包都合入父分支、波末门槛跑完时，本波结束。\n- 需要做 3.2 中的事或越过写集时，停止依赖部分，交回时写明。\n\n## 4. 方法与验证\n\n| 项目 | 本次值 |\n| --- | --- |\n| 主工作类型 | feature（开发为主），poteto-mode |\n| 风险级别 | L2：实现评审。成员 SPEC 另派 design-reviewer 做表达评审 |\n| 闭包门槛 | 见[范式 r1 §6](../operating-model.md#6-质量门槛) |\n| 进度记录 | 各线 `plan.md` 的进度总览；侧边栏进展页 |\n\n## 附录：闭包\n\n| 闭包 | 写范围 | 依赖 | 规格 |\n| --- | --- | --- | --- |\n| `w1-skill-contract` | `packages/skills/skill-contract/` | F | [delegate/closures/w1-skill-contract.md](../../delegate/closures/w1-skill-contract.md) |\n| `w1-mcp-contract` | `packages/mcp/mcp-contract/` | F | [delegate/closures/w1-mcp-contract.md](../../delegate/closures/w1-mcp-contract.md) |\n\n两个闭包并行。\n", "skill-spec": "# W1 Skill 线实施规格：`@omne-harness/skill-contract`\n\n格式沿 `claim` 技能 `references/spec-template.md`，方法 Matt `to-spec`。只写差额，共用部分引用。\n\n- 卡：无卡，负责人 2026-11-03 会话内要求；波包 [w1/wave-pack.md](../wave-pack.md)；F `21175c9f9f05a29d1db509420b75d2b016ed2fbe`\n- 上一层：[线级地图](../../line-skill/context-map.md)；[共用约束](../../constraints.md)；[范式 r1](../../operating-model.md)\n- 主工作类型：feature → poteto-mode\n- 风险级别：L2。契约成员首次建立公开形状，后续波段都依赖它；读取关口的无披露要求在 W2 实现时按 L3 读\n\n## Problem Statement\n\nW2 的通用实现与本地来源、W3 的目录与导出都要依赖 Skill 的值、失败、端口与服务接口。现在 `skill-contract` 只有 `skillBodyContract`，组页写的值、纯函数、端口和符合性设施都还只是正文里的候选，且有十多项「归 skill-contract 的规格」尚未封闭。没有它们，W2 的写者只能各自猜形状。\n\n## Solution\n\n把 `skill-contract` 做成后续波段能直接依赖的纯契约成员：公开根给调用方（值、失败、服务接口、纯函数、类别端口），`./provider` 给端口实现方（三个需求端口与 `SkillRef`），`./testing` 给实现方自测（三个端口的符合性套件与内存替身）。成员 SPEC 封闭组页列给本成员的全部未定项。\n\n## 依据与已定事项\n\n| 依据 | 精确修订 | 本规格采用的范围 |\n| --- | --- | --- |\n| 组工程设计 `packages/skills/docs/architecture.md` | F | 「模型」「资产正文与 Skill 包」「端口」「应用服务」「检查与发现」「包格式规则」「读取」「失败种类」「验证」 |\n| 组入口 `packages/skills/README.md` | F | 「成员与依赖」 |\n| DDD 与 SOLID 建模 `tmp/skill-mcp-domain/model/README.md` | 2026-11-03 本地 | 「Skill 上下文」全节；「建模发现」F6、F7、F8、F9 |\n| 类型草图 `tmp/skill-mcp-domain/model/skill/{values,ports,failures,services,functions}.ts` | 2026-11-03 本地，`tsc` 通过 | 形状的起点。与组页冲突时以组页为准 |\n| 资产公开类型 `packages/assets/assets/src/identity.ts` | F | `BodyContract`、`CapabilityId`、`JudgeContext`、`Declarations` |\n| 官方 Agent Skills 规格 | https://agentskills.io/specification | name、description 字段规则；目录结构 |\n\n已定事项（reduce 裁定，写者照做）：\n\n1. **入口**：`exports` 为 `.`、`./provider`、`./testing` 三个，都写 `source`、`types`、`import`。`./testing` 不被公开根导入。\n2. **内容摘要算法**：条目摘要是 `sha256:` 加小写十六进制的 SHA-256（对条目原字节）。快照摘要对按包内路径（UTF-16 码元序）排序后的每个条目拼接 `<路径>\\0<条目摘要>\\n` 再做 SHA-256，同一前缀。包根目录名不进入摘要。\n3. **`SafeReason`**：品牌字符串，只由 `toSafeReason(text)` 授予：长 1 到 256 个字符，不含控制字符。\n4. **读取内容**：`ReadContent` 是文本或字节两种（见草图 `services.ts`）。Skill 不产出 `ContentBlock`，内容块的组装归接收方。字节范围的单位是字节。文本条目交出的实际范围向内收到完整 UTF-8 字符边界，并在结果里如实写出实际范围。\n5. **正文起点**：正文从闭合定界行的行终止符之后开始。读正文时，内容摘要核对整个 `SKILL.md` 条目，字节范围相对正文起点（建模发现 F7）。\n6. **默认读取上限**：65536 字节一页。上限值写进 SPEC，W2 的服务按它实现。\n7. **中止**：失败种类 `aborted`。\n8. **`.omne/skill.json` 的形状**：`{ \"formatVersion\": 1, \"dependencies\": [{ \"category\": \"tool\", \"name\": … }], \"scripts\": [{ \"entry\": 包内路径, \"runKind\": …, \"facilities\": [ … ], \"parameters\"?: JSON }], \"settings\": [{ \"name\": …, \"category\": … }] }`。`formatVersion` 不是 1 时拒绝为 `declaration-format-unsupported`。`runKind` 与设施名的词法是 `^[a-z][a-z0-9-]{0,31}$`，Skill 不解释它们。`parameters` 原样保存为 `JsonValue`。三个数组都可以缺省，缺省按空数组处理；这是形状规则，不是「补缺省值」。\n9. **设置类别**：取值恰为统一语言「设置项类别」的四个：`preference`、`binding`、`placement-identity`、`governance`。其他值拒绝为 `setting-category-unknown`。\n10. **声明项编码**：`deriveDeclarations` 对每项设置声明产出一个条目 `setting:<类别>:<名字>`。依赖与脚本不产出声明项。\n11. **读取声明的 JSON 预算**：`maxBytes` 65536、`maxDepth` 16、`maxItems` 4096、`maxMembers` 256、`maxStringLength` 4096、`maxNumberLength` 32。写进 SPEC。\n12. **YAML 头部**：用 `yaml` 2.9.1（已由 reduce 声明依赖）解析，开启重复键检测；只解释 name、description、license、compatibility、metadata、`allowed-tools`，其余字段原样保存在 `extra`，不解释。\n13. **`skillBodyContract` 的扩展**：只做可加扩展：可选的 `description`、`scripts`、`settings`、`package.digest`。旧正文仍合法，现有两个测试文件不改断言。\n14. **`SkillResolution.adopted`**：答复类型收窄为 `CatalogResolution`（建模发现 F6）。\n15. **`sealSnapshot`**：快照只能经它构造，导出在 `./provider`（建模发现 F8）。前缀冲突用逐级查祖先的算法，不靠排序相邻（草图 `functions.ts` 已修正这一点）。\n\n## 原则与约束\n\n无新增，见[共用约束](../../constraints.md)。\n\n### 跨域概念的五问\n\n1. 需要的外域概念：能力标识、来源层、资产版本。缺少能力标识就无法定位身份；缺少来源层与资产版本就无法向调用方指明材料。\n2. 它们的含义与权威状态归 assets；Skill 只搬运，不解释、不保存。\n3. 能力标识用 `@omne-harness/assets` 的 `CapabilityId`；来源层用四格字面量联合；资产版本是 Skill 不解释的品牌字符串。\n4. 正常、失败、未知的交接都经 `SkillResolution` 的答复，映射表见组页「端口」。\n5. 换掉调用方或 assets 的实现时，读取次序、无披露与版本语义不变。反例：调用方用旧依据读已撤权的能力，仍得到 `not-available-to-you`。\n\n### 失败语义\n\n| 情形 | 行为 | 由谁负责 | 怎样验证 |\n| --- | --- | --- | --- |\n| 正常 | 纯函数返回 `ok` | 本成员 | 穷举测试 |\n| 失败 | 返回封闭集合里的失败；不抛出（类别端口按 assets 约定在判断失败后抛出的除外） | 本成员 | 每种失败一个反例 |\n| 未知 | 端口答 `unknown` 时服务失败为 `unknown`，不压成拒绝或空 | W2 的实现；本波由符合性套件约束端口 | 套件用例 |\n| 取消与清理 | 本成员没有异步资源 | — | 不适用 |\n| 外部效果 | 无 | — | 不适用 |\n\n可配置的策略：读取上限、声明的 JSON 预算，见已定事项 6、11。\n\n## User Stories\n\n1. 作为 Skill 包的作者，我要在加载时就知道包是否合法以及第一个拒绝原因，以便修正包。\n2. 作为来源实现方，我要一个唯一的快照构造器，以便我交出的快照摘要必然与条目一致。\n3. 作为来源实现方，我要一套符合性套件，以便证明我的来源与其他来源行为一致。\n4. 作为对应与读取权的实现方，我要符合性套件核对「对无权主体答复不随身份是否存在而变」。\n5. 作为调用方，我要按操作收窄的失败类型，以便只处理真会出现的失败。\n6. 作为调用方，我要材料依据不含包定位，以便我无法借依据指定包的位置。\n7. 作为资产治理，我要 `skillBodyContract` 派生设置声明项，以便配值能落到正确的类别。\n8. 作为后续波段的写者，我要成员 SPEC 封闭全部未定项，以便不用猜形状。\n\n## Implementation Decisions\n\n- 模块：`values`、`failures`、`functions`（含 `parse` 的子模块）、`services`、`contract`（现有类别端口）、`provider`、`testing`。按责任拆，单文件不超过约 300 行。\n- 公开根导出：值、失败、服务接口与结果值、纯函数（`sealSnapshot` 除外）、`skillBodyContract`。\n- `./provider` 导出：`SkillPackageSource`、`SkillResolution`、`SkillReadCheck`、`Resolution`、`CatalogResolution`、`SourceFailure`、`Reply`、`SkillRef`、`PackageLocator`、`sealSnapshot`、`SnapshotDefect`。\n- `./testing` 导出：`describeSkillPackageSourceConformance`、`describeSkillResolutionConformance`、`describeSkillReadCheckConformance`（参数为实现工厂与样本），以及内存替身 `createMemorySource`、`createMemoryResolution`、`createMemoryReadCheck`。套件基于 vitest 的 `describe`/`it`。\n- `schema/skill-declaration.schema.json`：`.omne/skill.json` 的 JSON Schema，与已定事项 8 一致。\n- 服务接口（`PackageInspection`、`SkillCatalog`、`SkillAccess`）只写接口与结果值，不写实现，也不写占位实现。\n- 形状从草图 `model/skill/*.ts` 起步；与组页不一致时以组页为准，并在交回中列出差异。\n\n## Testing Decisions\n\n- 先写变红的测试，再实现。\n- 包样本：`tests/fixtures/packages/` 下每个拒绝原因至少一个包，另有合法包若干（含 CRLF、未知头部字段、二进制资源、嵌套目录）。拒绝次序用「同时违反两条」的包验证。\n- 纯函数穷举：`toSkillName`（官方词法的每条边界）、`toPackagePath`、`sealSnapshot`（重复路径、不相邻的前缀冲突 `a`/`a-b`/`a/b`、次序无关、包根名无关）、`computeDigest`、`projectAssetBody`、`toSafeReason`。\n- 符合性套件对三个内存替身全绿；另写一个故意违反「无披露」的替身，证明套件会变红。\n- `skillBodyContract`：现有两个测试文件原样通过；新增可加字段的接受与拒绝用例。\n- 测试接缝：公开入口（包名导入），不深导入内部模块。\n\n| 检查 | 命令 | 何时跑 |\n| --- | --- | --- |\n| 成员门禁 | `pnpm turbo run build typecheck test --filter=@omne-harness/skill-contract` | 每次提交前 |\n| 预检 | `pnpm run preflight` | 交回前 |\n| 结构扫描 | `pnpm package:template scan --member packages/skills/skill-contract --json` | 交回前 |\n| 差分变异 | `pnpm run mutation`，范围本成员 | reduce 在合入前跑 |\n\n- 不能声称：读取权、解析、耐久已验证（替身通过不证明这些）。\n\n## 待决事项\n\n无。\n\n## Out of Scope\n\n- 三个应用服务的实现与 `SkillAccess` 符合性套件（W2）。\n- 目录来源 `DirectorySource`（W2，skill-host-local）。\n- 修改组页、领域页、统一语言（reduce 在波末做）。\n\n## Further Notes\n\n- 判据 SC1–SC8 见 [plan.md](plan.md)「切片」。\n", "skill-plan": "# W1 Skill 线交付计划：`@omne-harness/skill-contract`\n\n格式沿 `claim` 技能 `references/plan-template.md`，方法 Matt `to-tickets`。与同目录 [spec.md](spec.md) 配套。\n\n## 进度总览\n\n进度：[□□□□□□□□□□] 0/4 切片已完成 · 更新 2026-11-03T13:51:09Z · head 21175c9f9\n当前：切片 01 第 3 步（写者实施）\n\n| 切片 | 交付的行为 | 对应判据 | 状态 |\n| --- | --- | --- | --- |\n| 01 | 合法 Skill 包被检查为 `SkillDefinition`，非法包按次序给出第一个拒绝原因 | SC1、SC2、SC3 | 待做 |\n| 02 | 来源实现方能用唯一构造器交出一致的快照，用套件证明自己合规 | SC4、SC5 | 待做 |\n| 03 | 资产治理从扩展后的 `skillBodyContract` 得到设置声明项，旧正文仍合法 | SC6 | 待做 |\n| 04 | 后续写者从 SPEC 读到全部已封闭的未定项 | SC7、SC8 | 待做 |\n\n| 闭包 | 写者模型@档位 | 清晰度 | 工作树 | 分支 | 状态 | 轮次 | 追加 | 验收报告 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| w1-skill-contract | claude-opus-5-5@high | 定 | `.worktrees/w1-skill-contract` | `PanQiWei/skill-mcp-w1-skill-co 度总览（承担：调度）\n\n### 02：快照构造器与端口套件\n\n- **交付：** `./provider` 的端口与 `sealSnapshot`；`./testing` 的三个套件与内存替身。\n- **被谁阻塞：** 01（共用值类型）。\n- **对应判据：** SC4、SC5。\n- **七步待办：** 同 01，第 2、7 步与 01 合并（同一闭包）。\n\n### 03：扩展类别端口\n\n- **交付：** `skillBodyContract` 的可加扩展与设置声明项。\n- **被谁阻塞：** 01。\n- **对应判据：** SC6。\n- **七步待办：** 同 02。\n\n### 04：SPEC、Schema 与骨架迁移\n\n- **交付：** 成员 SPEC、`schema/`、完整骨架。\n- **被谁阻塞：** 01–03（SPEC 写实际形状）。\n- **对应判据：** SC7、SC8。\n- **七步待办：** 同 02。\n\n## 集中检查\n\n- 结构读数与差分变异：闭包交回后 reduce 在闭包 head 上跑一次。\n- 常规评审：交回后一次实现评审（L2），一次 SPEC 表达评审。\n- 波末：父分支头一次准入（质量读数）。\n\n## 交回清单\n\n- [ ] 进度总览改成最终状态\n- [ ] 闭包 PR 合入父分支，读回父分支头\n- [ ] 判据证据写进本文件「判据」表\n- [ ] 波末交接报告 `w1/handoff.md` 的 Skill 一节\n\n## 顺序与并行\n\n- 01 → 02 → 03 → 04，同一写者顺序做。\n- 与 MCP 线的 `w1-mcp-contract` 并行，写集不相交，只依赖 F。\n", "mcp-spec": "# W1 MCP 线实施规格：`@omne-harness/mcp-contract`\n\n格式沿 `claim` 技能 `references/spec-template.md`，方法 Matt `to-spec`。只写差额，共用部分引用。\n\n- 卡：无卡，负责人 2026-11-03 会话内要求；波包 [w1/wave-pack.md](../wave-pack.md)；F `21175c9f9f05a29d1db509420b75d2b016ed2fbe`\n- 上一层：[线级地图](../../line-mcp/context-map.md)；[共用约束](../../constraints.md)；[范式 r1](../../operating-model.md)\n- 主工作类型：feature → poteto-mode\n- 风险级别：L2。契约成员首次建立公开形状。秘密值与租户隔离的实际保护在 W2、W3 的实现里，按 L3 读\n\n## Problem Statement\n\nW2 的连接、关口、清单与发现，W3 的调用口与两种传输，都要依赖 MCP 的值、结局、端口与服务接口。现在 `mcp-contract` 只是模板草稿。组页列给「mcp-contract 的 SPEC」的未定项有十余项（拒绝与未发出原因的封闭集合、凭据用途值域、授权发现字段、`StdioLaunch` 的变量绑定、上界与配置缺项等），不封闭它们，W2、W3 的写者只能各自猜。\n\n## Solution\n\n把 `mcp-contract` 做成纯契约成员：公开根给调用方（值、结局、失败、五个服务接口、纯函数、接入点正文的类别端口），`./provider` 给实现方（五个需求端口、`McpTransport`、`McpTransportFactory`），`./testing` 给实现方自测（五个需求端口的符合性套件与内存替身，`classifyOutcome`、`mergeListing` 的穷举入口）。成员 SPEC 封闭组页列给本成员的未定项。不依赖官方 SDK。\n\n## 依据与已定事项\n\n| 依据 | 精确修订 | 本规格采用的范围 |\n| --- | --- | --- |\n| 组工程设计 `packages/mcp/docs/architecture.md` | F | 「协议基线与兼容」「模型」「值对象」「MCP 连接」「MCP 动作清单与 MCP 已知动作」「设置声明与逐动作权限」「MCP 声明的端口」「应用服务」「调用结果」「内容交付」「失败种类」；Q-MC03 剩余义务第 599–604 行 |\n| 组入口 `packages/mcp/README.md` | F | 「成员与依赖」 |\n| DDD 与 SOLID 建模 `tmp/skill-mcp-domain/model/README.md` | 2026-11-03 本地 | 「MCP 上下文」全节；「建模发现」F1–F5、F9 |\n| 类型草图 `tmp/skill-mcp-domain/model/mcp/{values,ports,outcomes,catalog,functions,services,gate}.ts` | 2026-11-03 本地，`tsc` 通过 | 形状的起点。与组页冲突时以组页为准 |\n| 资产公开类型 `packages/assets/assets/src/identity.ts` | F | `BodyContract` |\n| 公共值 `packages/common/json-text/src/types.ts`、`packages/common/content-block/src/index.ts` | F | `JsonValue`（保留数字字面量）、`ContentBlock` |\n| MCP 协议 2026-07-28 修订 | https://modelcontextprotocol.io/specification/2026-07-28 | 结果形状、`resultType`、多轮输入、任务扩展、授权 |\n\n已定事项（reduce 裁定，写者照做）：\n\n1. **入口**：`exports` 为 `.`、`./provider`、`./testing`，都写 `source`、`types`、`import`。\n2. **类别名**：接入点正文登记的类别是 `mcp`。\n3. **接入点正文**：`{ \"name\": …, \"transport\": \"stdio\" | \"streamable-http\", \"launch\"?: { \"command\", \"args\"?, \"cwd\"?, \"env\"?: [{ \"name\", \"source\": \"setting\" | \"credential\" }], \"facilities\"? }, \"auth\": \"none\" | \"static\" | \"oauth\" }`。`launch` 只在 `stdio` 时出现且必需。name 的词法同 Skill name（`^[a-z0-9]+(?:-[a-z0-9]+)*$`，1–64），必须等于能力名，否则拒绝为 `name-mismatch`。拒绝原因集合：`malformed`、`name-mismatch`、`transport-unknown`、`auth-unknown`、`launch-missing`、`launch-unexpected`。JSON Schema 放 `schema/endpoint-body.schema.json`。\n4. **`StdioLaunch` 的变量绑定**（组页第 600 行）：`env` 每项写变量名与来源。`setting` 表示取 `AdoptionView` 交来的同名非秘密配值；`credential` 表示由凭据句柄在起进程时注入。正文不写值。\n5. **设置声明项**：三项固定设置按「设置声明与逐动作权限」一节。声明项编码同 Skill：`setting:<类别>:<名字>`。连接目标 `setting:placement-identity:target` 只对 `streamable-http` 产出；凭据 `setting:placement-identity:credential` 只在 `auth` 不是 `none` 时产出；连接超时 `setting:preference:connect-timeout` 总是产出。逐动作权限项本波不经类别端口产出（组页「剩余义务」：`deriveDeclarations` 拿不到清单），只提供纯函数 `actionPermissionItems`。\n6. **对端账号**：只由 `peerAccountOf(auth, binding)` 派生；`CredentialUse.acquire` 只答句柄（建模发现 F2）。\n7. **`AdoptionView`**：两个操作 `endpoints(access, scope)` 与 `endpoint(access, ref)`（建模发现 F1）。\n8. **组内端口**：`McpTransport` 与 `McpTransportFactory` 在 `./provider`（建模发现 F3）。\n9. **`mergeListing`**：只按清单修订做条件判断，不跨连接比较代际（建模发现 F4）；输入只能是 `completeListing` 构造的完整清单。\n10. **未发出原因**：封闭集合 `not-available-to-you`、`blocked`（带 `local-command-not-enabled` 或 `disabled`）、`unknown`、`correlation-key-in-use`、`cancelled`（建模发现 F5）、`definition-changed`、`action-unavailable`、`mode-unsupported`、`credential-unavailable`（带 `missing`、`rejected`、`unknown`）、`authorization-required`（带授权发现）、`landing-unavailable`、`connection-unavailable`、`config-missing`（带 `connect-timeout` 或 `target`）。\n11. **不可用原因**：封闭集合 `no-longer-offered`、`connection-unavailable`、`authorization-required`、`credential-unavailable`、`landing-unavailable`。\n12. **结局**：`CallOutcome` 六种（`complete`、`toolError`、`inputRequired`、`task`、`protocolError`、`unknown`），`unknown` 的子因 `stream-broken`、`process-exited`、`abandoned`。\n13. **授权发现**（组页第 599 行）：`{ resourceMetadataUrl: string, resourceMetadata: Untrusted<JsonValue>, issuers: string[], scopes: string[] }`。\n14. **凭据用途**（组页第 599 行）：`{ kind: 'process-env' } | { kind: 'http-authorization', target }`。\n15. **上界与配置**（组页第 603、604 行）：`McpConfig` 必填字段 `principalKey`、`maxListingPages`、`maxActions`、`instructionsByteLimit`，SPEC 写明含义与合法范围，不给默认值。连接超时缺值时，用调用方在操作请求里给的可选 `connectBound`；两者都没有时，未发出原因是 `config-missing`（`connect-timeout`）。`refresh`、`invoke`、`continueWithInput` 的请求带可选 `connectBound`。\n16. **`classifyOutcome`**：输入是对端应答（结果或 JSON-RPC 错误）与一个注入的输出校验函数 `(structured, outputSchema) => OutputCheck`。本成员不依赖 JSON Schema 校验库，校验函数由 W2 的通用实现提供。\n17. **`toContentBlocks`**：规则按「内容交付」一节。公共 `ContentBlock` 表达不了的内容原样带协议类型交出；不合法的一项转成说明类型与原因的文本块。\n18. **不可信值**：`serverInfo`、`instructions`、annotations、进度与日志通知都用 `Untrusted<T>` 包住。\n19. **服务接口**：五个服务只写接口与结果值，不写实现，也不写占位实现。`ActionInvoker` 写成 `ActionCalls & TaskControl`。\n\n## 原则与约束\n\n无新增，见[共用约束](../../constraints.md)。另加一条：官方 SDK 的任何类型不进入本成员。\n\n### 跨域概念的五问\n\n1. 需要的外域概念：租户（来自 `access`）、接入点持有、采用修订、凭据配值。缺少租户与对端账号就无法隔离连接；缺少采用修订就无法在正文或配值变化时换连接。\n2. 持有与采用修订的含义归 assets，凭据配值归设置与凭据保管方；MCP 只比较相等，不解释、不保存秘密。\n3. 持有、采用修订、凭据配值都是 MCP 不解释的品牌字符串；租户用 `legal-identity` 的 `TenantId`。\n4. 采用不可读答 `unknown`；未采用答 `not-available-to-you`；凭据失败按 `credential-unavailable`；交接表见组页「MCP 声明的端口」。\n5. 换掉调用方或端口提供者时，隔离键、无披露与「不自动重发」不变。反例：同一接入点被两个租户采用，两者的连接键不同。\n\n### 失败语义\n\n| 情形 | 行为 | 由谁负责 | 怎样验证 |\n| --- | --- | --- | --- |\n| 正常 | 纯函数返回 `ok` | 本成员 | 穷举测试 |\n| 失败 | 返回封闭集合里的原因；不抛出（类别端口按 assets 约定除外） | 本成员 | 每种原因一个反例 |\n| 未知 | 端口答 `unknown` 时不压成拒绝或空 | W2；本波由符合性套件约束端口 | 套件用例 |\n| 取消与清理 | 本成员没有异步资源 | — | 不适用 |\n| 外部效果 | 无 | — | 不适用 |\n\n## User Stories\n\n1. 作为接入点作者，我要在加载时知道正文是否合法、是否可能启动本机命令，以便修正正文。\n2. 作为资产治理，我要从类别端口得到三项固定设置的声明项，以便配值落到正确类别。\n3. 作为端口实现方，我要五个需求端口的符合性套件，以便证明我的实现合规，尤其是「对无权主体答复不随接入点是否存在而变」。\n4. 作为通用实现的写者，我要 `mergeListing` 只接受完整清单并保持已知动作，以便不用再推导采用算法。\n5. 作为调用方，我要「未发出」与「已发出」在类型上分开，以便知道哪些结局可能有对端效果。\n6. 作为调用方，我要对端自报的内容在类型上标为不可信，以便我不把它当作身份或授权依据。\n7. 作为后续波段的写者，我要成员 SPEC 封闭全部未定项。\n\n## Implementation Decisions\n\n- 模块：`values`、`outcomes`、`catalog`（清单记录、`KnownAction`、`completeListing`、`mergeListing`、`markUnavailable`、`actionPermissionItems`）、`endpoint`（正文解析与类别端口）、`classify`（`classifyOutcome`、`toContentBlocks`）、`keys`（`peerAccountOf`、两个键函数）、`services`、`provider`、`testing`。单文件不超过约 300 行。\n- 公开根导出：值、结局、失败、服务接口与结果值、纯函数、类别端口工厂 `mcpEndpointBodyContract()`。\n- `./provider` 导出：`AdoptionView`、`AdoptedEndpoint`、`UseEligibility`、`EligibilityVerdict`、`CredentialUse`、`CredentialHandle`、`CredentialPurpose`、`ProcessLanding`、`ProcessHandle`、`StopScope`、`CatalogStore`、`ExpectedRevision`、`McpTransport`、`McpTransportFactory`、`TransportFailure`、`ListingPage`、`CallRequest`、`AuthorizationDiscovery`。\n- `./testing` 导出：五个需求端口的符合性套件 `describe<端口>Conformance`，内存替身 `createMemoryAdoptionView`、`createMemoryUseEligibility`、`createMemoryCredentialUse`、`createMemoryProcessLanding`、`createMemoryCatalogStore`，以及 `classifyOutcome`、`mergeListing` 的穷举样本表 `classifyOutcomeCases`、`mergeListingCases`。\n- 形状从草图 `model/mcp/*.ts` 起步；与组页不一致时以组页为准，在交回中列出差异。\n\n## Testing Decisions\n\n- 先写变红的测试，再实现。\n- `classifyOutcome`：按协议 2026-07-28 的结果形状做穷举表，覆盖六种结局与 `isError`、缺 `resultType`、未知 `resultType`、JSON-RPC 错误码。\n- `mergeListing` 性质测试：已知动作不静默消失；基于旧修订被拒；只接受完整清单；空清单也是「已取得」；修订加一。\n- `completeListing`：任一页失败整次不采用；重名拒绝。\n- `toContentBlocks`：每种协议内容类型一例；不合法一项转文本块且不丢其余。\n- 正文解析：每个拒绝原因一个反例；`launchesLocalCommand` 对两种传输。\n- 符合性套件对五个内存替身全绿；故意违反无披露的 `UseEligibility` 替身使套件变红；`CatalogStore` 套件覆盖修订冲突与「从未写入时以 absent 为期望」。\n- 测试接缝：公开入口与 `./provider`、`./testing`（包名导入）。\n\n| 检查 | 命令 | 何时跑 |\n| --- | --- | --- |\n| 成员门禁 | `pnpm turbo run build typecheck test --filter=@omne-harness/mcp-contract` | 每次提交前 |\n| 预检 | `pnpm run preflight` | 交回前 |\n| 结构扫描 | `pnpm package:template scan --member packages/mcp/mcp-contract --json` | 交回前 |\n| 差分变异 | `pnpm run mutation`，范围本成员 | reduce 在合入前跑 |\n\n- 不能声称：真实对端、真实凭据、真实进程落点的行为（W3 与 M2 之后）。\n\n## 待决事项\n\n无。\n\n## Out of Scope\n\n- 五个服务的实现、内存 `CatalogStore` 的生产实现（W2，mcp）。\n- 传输契约测试套件与真实服务端夹具（W3）。\n- 官方 SDK 依赖。\n- 修改组页、领域页、统一语言（reduce 在波末做）。\n\n## Further Notes\n\n- 判据 MC1–MC8 见 [plan.md](plan.md)「判据」。\n- `./testing` 的内存 `CatalogStore` 替身与 W2 `mcp` 里的生产内存实现不是同一个东西：前者只为套件自测，后者是第一波的真实实现。W2 决定是否复用。\n", "mcp-plan": "# W1 MCP 线交付计划：`@omne-harness/mcp-contract`\n\n格式沿 `claim` 技能 `references/plan-template.md`，方法 Matt `to-tickets`。与同目录 [spec.md](spec.md) 配套。\n\n## 进度总览\n\n进度：[□□□□□□□□□□] 0/4 切片已完成 · 更新 2026-11-03T13:51:09Z · head 21175c9f9\n当前：切片 01 第 3 步（写者实施）\n\n| 切片 | 交付的行为 | 对应判据 | 状态 |\n| --- | --- | --- | --- |\n| 01 | 接入点正文被判定为 `EndpointDefinition` 或给出拒绝原因；类别端口产出设置声明项 | MC1、MC2 | 待做 |\n| 02 | 清单采用算法与结局分类可以穷举测试 | MC3、MC4、MC5 | 待做 |\n| 03 | 端口实现方能用五个符合性套件证明合规 | MC6 | 待做 |\n| 04 | 后续写者从 SPEC 读到全部已封闭的未定项 | MC7、MC8 | 待做 |\n\n| 闭包 | 写者模型@档位 | 清晰度 | 工作树 | 分支 | 状态 | 轮次 | 追加 | 验收报告 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| w1-mcp-contract | claude-opus-5-5@high | 定 | `.worktrees/w1-mcp-contract` | `PanQiWei/skill-mcp-w1-mcp-contract` | 进行中 | 1 | 0 | — |\n\n四个切片写同一成员，合成一个闭包，一个写者按 01→04 顺序做。\n\n## 判据\n\n| ID | 判据 | 证据 |\n| --- | --- | --- |\n| MC1 | 公开根、`./provider`、`./testing` 的导出键集合与 spec「Implementation Decisions」一致；公开根不导入 `./testing`；成员不依赖任何 SDK | `tests/public-entry.spec.ts`；`package.json`  符合性套件；DirectorySource；组页、领域页、统一语言的修改；任何新依赖。\n\n### 写范围\n- `packages/skills/skill-contract` — 本闭包唯一的写入目录。package.json 只允许改 exports、files 与 scripts，不改 dependencies 与 devDependencies\n\n### 排除的调用方\n- `packages/skills/skill` — W2 的通用实现草稿，本闭包不改；停止条件：需要它配合时停下交回\n- `packages/skills/skill-host-local` — W2 的目录来源草稿，本闭包不改\n- `packages/assets/assets` — 资产成员，本闭包只读它的公开类型；停止条件：需要改资产类型才能实现时停下交回\n- `pnpm-lock.yaml` — 共享文件，只由 reduce 写；停止条件：需要新依赖时停下交回\n- `packages/skills/docs` — 组页由 reduce 在波末写回\n\n## 验收清单\n- A1 公开根、./provider、./testing 三个入口存在；导出键集合与 spec.md「Implementation Decisions」一致；公开根不导入 ./testing（判据 SC1）。\n- A2 tests/fixtures/packages/ 下每个拒绝原因至少一个包样本；同时违反两条时给出次序靠前的那条（SC2）。\n- A3 纯函数的边界穷举：toSkillName 覆盖官方 name 词法的每条边界；toPackagePath 拒绝绝对路径、.. 段、反斜杠、空段；toSafeReason；computeDigest；projectAssetBody（SC3）。\n- A4 sealSnapshot 拒绝重复路径与前缀冲突，用例含 a、a-b、a/b 三个条目；摘要与条目次序、包根名无关（SC4）。\n- A5 三个符合性套件对内存替身全绿；另有一个故意违反「对无权主体答复不随身份是否存在而变」的替身，证明套件会变红（SC5）。\n- A6 tests/contract.spec.ts 与 tests/public-entry.spec.ts 的原有断言不改且通过；新增可加字段的接受与拒绝用例；deriveDeclarations 对每项设置产出 setting:<类别>:<名字>（SC6）。\n- A7 成员是 3.0.0 完整骨架；pnpm package:template scan --member packages/skills/skill-contract --json 除草稿标记外无缺项，或剩余项在交回中逐条说明（SC7）。\n- A8 SPEC 封闭 spec.md「已定事项」1–15 与组页第 71、77、87、324、346、491、524、539 行列给本成员的未定项；schema/skill-declaration.schema.json 与已定事项 8 一致（SC8）。\n- 收尾门禁：pnpm turbo run build typecheck test --filter=@omne-harness/skill-contract；pnpm run preflight；pnpm run format:check；pnpm run lint:rules。失败时先在基线上复跑同一命令，区分既有失败与本闭包引入的失败。\n- 接受级别 L2。提交 trailer：Harness: claude-code、Agent-Role: developer；作者用环境变量里的 PanQiWei 身份，不写 Co-Authored-By。按切片提交，至少四个提交。\n\n## 实施规格\n负责人原则：Skill 领域只交付领域内部与用 Skill 的词表达的对外契约；契约与 SPEC 不点名调用方。Skill 不判定依赖可用性，不交设置值，不执行脚本。\n\n### 命名账本\n- 值：SkillName、PackagePath、EntryDigest、PackageDigest、AssetVersion、SafeReason、MediaType、PackageEntry、SkillPackageSnapshot、PackageLocator、SkillManifest、ScriptDeclaration、SettingDeclaration、SkillDeclaration、SkillDefinition、DeclaredProjection、ScriptIdentity、SkillMaterialBasis、S f、catalogKeyOf、connectionKeyOf。\n3. 端口与套件：./provider（五个需求端口、McpTransport、McpTransportFactory）；./testing（五个需求端口的符合性套件、内存替身、classifyOutcome 与 mergeListing 的穷举样本表）；五个服务接口。\n4. 成员 SPEC。\n\n形状与决定：\n- 以 spec.md「已定事项」1–19 为准，逐条照做，不重新裁定。\n- 形状从 DDD 草图起步：/home/user/omne-harness-lite/.worktrees/skill-mcp/tmp/skill-mcp-domain/model/mcp/values.ts、ports.ts、outcomes.ts、catalog.ts、functions.ts、services.ts。草图已用 tsc 校验，catalog.ts 的 mergeListing 已改为只按修订判断。草图与 spec.md 的已知差异：spec 已定事项 3 把 StdioLaunch 的 envNames 改成带来源的 env 项；已定事项 15 新增 connectBound 与 McpConfig 的三个上界字段；已定事项 16 让 classifyOutcome 接收注入的输出校验函数。以 spec 为准。\n- connection.ts、in-flight.ts、gate.ts 是 W2 通用实现的参考，本闭包不实现它们。\n- 建模说明 /home/user/omne-harness-lite/.worktrees/skill-mcp/tmp/skill-mcp-domain/model/README.md 的「MCP 上下文」「建模手法」「建模发现」F1–F5、F9 是本闭包的设计依据。\n- 组页 packages/mcp/docs/architecture.md 是技术唯一源。草图与组页不一致时以组页为准，并在交回中列出每一处差异。\n\n不在范围内：五个服务的实现；生产用内存 CatalogStore；传输契约测试与真实服务端夹具；官方 SDK；组页、领域页、统一语言的修改；任何新依赖。\n\n### 写范围\n- `packages/mcp/mcp-contract` — 本闭包唯一的写入目录。package.json 只允许改 exports、files 与 scripts，不改 dependencies 与 devDependencies\n\n### 排除的调用方\n- `packages/mcp/mcp` — W2 的通用实现草稿，本闭包不改；停止条件：需要它配合时停下交回\n- `packages/mcp/mcp-host-local` — W3 的本地宿主草稿，本闭包不改\n- `packages/assets/assets` — 资产成员，本闭包只读它的公开类型；停止条件：需要改资产类型才能实现时停下交回\n- `pnpm-lock.yaml` — 共享文件，只由 reduce 写；停止条件：需要新依赖时停下交回\n- `packages/mcp/docs` — 组页由 reduce 在波末写回\n\n## 验收清单\n- A1 公开根、./provider、./testing 三个入口的导出键集合与 spec.md「Implementation Decisions」一致；公开根不导入 ./testing；成员不依赖任何 MCP SDK（判据 MC1）。\n- A2 正文的每个拒绝原因一个反例；launchesLocalCommand 对两种传输；deriveDeclarations 按已定事项 5 产出（MC2）。\n- A3 completeListing 与 mergeListing 的性质测试：已知动作不静默消失并保留最近合法定义；基于旧修订被拒；任一页失败整次不采用；重名拒绝；空清单是「已取得」；修订加一（MC3）。\n- A4 classifyOutcome 穷举表覆盖六种结局，以及 isError、缺 resultType、未知 resultType、JSON-RPC 错误码；输出校验通过注入函数得到三种结论（MC4）。\n- A5 toContentBlocks 每种协议内容类型一例；不合法一项转成文本块且不丢其余各项（MC5）。\n- A6 五个符合性套件对内存替身全绿；故意违反「对无权主体答复不随接入点是否存在而变」的 UseEligibility 替身使套件变红；CatalogStore 套件覆盖修订冲突与「从未写入时以 absent 为期望」（MC6）。\n- A7 pnpm package:template scan --member packages/mcp/mcp-contract --json 除草稿标记外无缺项，或剩余项在交回中逐条说明（MC7）。\n- A8 SPEC 封闭 spec.md「已定事项」1–19 与组页第 401、430、465、525、599–604 行列给本成员的未定项；schema/endpoint-body.schema.json 与已定事项 3 一致（MC8）。\n- 收尾门禁：pnpm turbo run build typecheck test --filter=@omne-harness/mcp-contract；pnpm run preflight；pnpm run format:check；pnpm run lint:rules。失败时先在基线上复跑同一命令，区分既有失败与本闭包引入的失败。\n- 接受级别 L2。提交 trailer：Harness: claude-code、Agent-Role: developer；作者用环境变量里的 PanQiWei 身份，不写 Co-Authored-By。按切片提交，至少四个提交。\n\n## 实施规格\n负责人原则：MCP 领域只交付领域内部与用 MCP 的词表达的对外契约；契约与 SPEC 不点名调用方。MCP 不做授权流程、不保管凭据、不选进程落点、不判定动作权限、不自动重发。\n\n### 命名账本\n- 值：EndpointName、EndpointHolding、AdoptionRevision、CredentialBinding、ActionName、DefinitionDigest、Generation、CatalogRevision、CorrelationKey、RequestState、TaskId、ProtocolVersion、Millis、Untrusted、EndpointRef、AuthKind、StdioLaunch、TransportDeclaration、EndpointDefinition、ConnectionTarget、EndpointSettings、PeerAccount、ConnectionKey、CatalogKey、PeerIdentity、ActionDefinition、KnownActionId、CallMode。\n- 清单：KnownAction、UnavailableReason、AdoptionBasis、Freshness、ActionCatalogRecord、CatalogState、CompleteListing、ListingDefect、MergeRefusal。\n- 结局：CallOutcome、DeliveredContent、OutputCheck、TaskStatus、Refusal、NotSentReason、InvokeResult。\n- 端口（./provider）：AdoptionView、AdoptedEndpoint、UseEligibility、EligibilityVerdict、BlockedReason、CredentialUse、CredentialHandle、CredentialPurpose、ProcessLanding、ProcessHandle、StopScope、CatalogStore、ExpectedRevision、McpTransport、McpTransportFactory、TransportFailure、ListingPage、CallRequest、AuthorizationDiscovery。\n- 服务接口：EndpointInspection、ActionDiscovery、ActionCalls、TaskControl、ActionInvoker、EndpointStatus、Connections，及结果值 CatalogView、RefreshResult、InvokeRequest、ContinueRequest、EndpointStatusView、McpConfig、McpPorts、McpServices。\n- 纯函数：parseEndpointBody、launchesLocalCommand、mcpEndpointBodyContract、digestDefinition、toContentBlocks、classifyOutcome、completeListing、mergeListing、markUnavailable、actionPermissionItems、peerAccountOf、catalogKeyOf、connectionKeyOf。\n\n##
