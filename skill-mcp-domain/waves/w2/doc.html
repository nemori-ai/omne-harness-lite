const DOCS = {"pack": "# W2 波包：通用实现与本地来源\n\n格式沿 `.meta_harness/human/map-reduce-delivery/templates/line-pack.md`，按[范式 r1](../operating-model.md) 变通：两条线合一份，没有线父卡、binding、轨道与 gate。\n\n## 1. 线与当前波\n\n| 项目 | 本次值 |\n| --- | --- |\n| 仓库、里程碑、reduce | `nemori-ai/omne-harness-lite`；边界是 M2 完结；reduce 是本会话 |\n| 线 | Skill 线、MCP 线，线负责人都是本会话 |\n| 当前波 | W2，两条线都 active |\n| 父分支与冻结输入 F | `PanQiWei/skill-mcp`，F = `b0f2ec7fb15a3f8572a36ef71af2fd30bf90ca01`（含 w2-prep：三个草稿成员的依赖与锁文件、两处 SPEC 张力裁定、MCP 组页四处写回；prep2：`PeerIdentity.serverInfo` 可选） |\n| 开波同步 | `origin/integration/mainline`（3e22e2f1c）已于 e54c974fd 合入父分支，无冲突 |\n| 开波前检查项 | [wave-queue.md](../wave-queue.md)「W2 开波前检查项」八项全部处置：主线合入；[2026-07-28 核对](schema-check.md)（W2 只受一项影响，已 prep2；13 项落 W3）；Skill `known-unavailable` 与 MCP S1/S2 两处张力已裁进 SPEC；MCP 组页 S7 四态、D4、`action`、Q-MC06 已写回；两线规格形态一致（本波两份 spec 同骨架）；夹具缺口与类型环下沉写进本波闭包规格 |\n| 上下文地图 | [Skill](../line-skill/context-map.md)、[MCP](../line-mcp/context-map.md)；共用约束 [constraints.md](../constraints.md) |\n\n## 2. 两条线在 M2 完结前的目标、边界与验收\n\n同 [W1 波包 §2](../w1/wave-pack.md#2-两条线在-m2-完结前的目标边界与验收)。\n\n## 3. 本波交付边界\n\n### 3.1 成果与判据\n\n| 成果 | 验收判据与证据 |\n| --- | --- |\n| `@omne-harness/skill`：`createPackageInspection`、`createSkillAccess`（describe、read、list、export） | [skill/spec.md](skill/spec.md) 判据 SK2-1–SK2-7 |\n| `@omne-harness/skill-contract/testing` 可加：`skillAccessConformance`、`manifest.ts` 边界夹具 | SK2-5、SK2-8 |\n| `@omne-harness/skill-host-local`：`createDirectorySource` | SK2-9–SK2-12 |\n| `@omne-harness/mcp`：`createMcpCore`（inspection、discovery、status、connections）、`createInMemoryCatalogStore`、聚合 `Connection` 与 `InFlightCalls`、关口 `admit` | [mcp/spec.md](mcp/spec.md) 判据 MC2-1–MC2-10 |\n| `w2-spike`（reduce，tmp）：官方 SDK 2.3.1 最小往返，结论进 W3 规格 | `waves/w2/spike/README.md` |\n| 实现架构页与进展页随每个闭包合入更新 | reduce |\n\n### 3.2 明确不做\n\n- `SkillCatalog`（`summaries`、`search`）：W3。\n- `ActionInvoker`（`invoke`、`continueWithInput`、`cancel`、四个任务操作）与任务表：W3。`createMcp` 在 W3 由 `createMcpCore` 加 invoker 组成。\n- stdio 与 Streamable HTTP 的真实传输、官方 SDK 依赖、真实服务端夹具：W3。\n- Cordis 契约成员与插件：W4。\n- 内容存储来源（`content-store` 定位）：W3 之后。\n- 组页、领域页、key-flows、统一语言：只由 reduce 在波末写回。\n\n### 3.3 冻结输入与写集\n\n- F：`b0f2ec7fb15a3f8572a36ef71af2fd30bf90ca01`。\n- 依赖的契约：`@omne-harness/skill-contract`（`.`、`./provider`、`./testing`）、`@omne-harness/mcp-contract`（同三入口）在 F 的形状。两个契约成员的 SPEC 是现行源。\n- 写集：\n\n| 闭包 | 写范围 | 禁写 |\n| --- | --- | --- |\n| `w2-skill` | `packages/skills/skill/`；`packages/skills/skill-contract/src/` 只做可加改动（新文件或新导出，不改已有签名与行为） | `skill-host-local`、`mcp/*`、依赖段、锁文件、组页 |\n| `w2-skill-host` | `packages/skills/skill-host-local/` | `skill`、`skill-contract`、依赖段、锁文件、组页 |\n| `w2-mcp-core` | `packages/mcp/mcp/` | `mcp-contract`、`mcp-host-local`、依赖段、锁文件、组页。需要契约可加改动时停下交回 |\n\n三个写集互不相交。`w2-skill` 与 `w2-skill-host` 都读 `skill-contract`，只有 `w2-skill` 能加它。\n\n- 禁写（全部闭包）：各成员 `package.json` 的 `dependencies`/`devDependencies`、`pnpm-lock.yaml`、`pnpm-workspace.yaml`、组页、领域页、`.meta_harness/`。需要新依赖时停下交回。\n\n### 3.4 需负责人批复\n\n无。W2 范围内的两处偏离（`export` 从 W3 提前到 W2；`createMcp` 推后到 W3，W2 交 `createMcpCore`）由 reduce 裁定，记进 [wave-queue.md](../wave-queue.md) 修订表。\n\n### 3.5 停止条件\n\n- 三个闭包都合入父分支、波末门槛跑完时，本波结束。\n- 写者需要 3.2 中的事、越过写集，或发现契约与 SPEC 不足以实现时，停止依赖部分，交回时写明。\n\n## 4. 方法与验证\n\n| 项目 | 本次值 |\n| --- | --- |\n| 主工作类型 | feature（开发为主），poteto-mode Feature 步骤；`how`/`architect` 两步由 DDD 建模（`model/`）与 W1 SPEC 承担，不再并行探索 |\n| 风险级别 | `w2-skill` L3（读取关口：无披露、依据、竞争）；`w2-mcp-core` L3（连接键隔离、凭据句柄生命周期、并发发布）；`w2-skill-host` L2 |\n| 闭包门槛 | 见[范式 r1 §6](../operating-model.md#6-质量门槛)；L3 热点由 reduce 逐行读 |\n| 评审 | 每闭包：review-delivery（按本波 spec 验收清单）、review-code 四面（正确性、结构读数、设计与实践、差分变异）；L3 另派 implementation-reviewer 逐行读热点 |\n| 进度记录 | 各线 `plan.md` 的进度总览；侧边栏进展页 |\n\n## 附录：闭包\n\n| 闭包 | 写范围 | 依赖 | 规格 | 模型@档位 |\n| --- | --- | --- | --- | --- |\n| `w2-skill` | `packages/skills/skill/`、`skill-contract/src/`（可加） | F | [delegate/closures/w2-skill.md](../../delegate/closures/w2-skill.md) | claude-fable-5-1@high（security-sensitive） |\n| `w2-skill-host` | `packages/skills/skill-host-local/` | F | [delegate/closures/w2-skill-host.md](../../delegate/closures/w2-skill-host.md) | claude-opus-5-5@high |\n| `w2-mcp-core` | `packages/mcp/mcp/` | F | [delegate/closures/w2-mcp-core.md](../../delegate/closures/w2-mcp-core.md) | claude-fable-5-1@high（security-sensitive、并发） |\n\n三个闭包并行。`w2-spike` 由 reduce 在等待期间做。\n", "skill-spec": "# W2 Skill 线实施规格：`@omne-harness/skill` 与 `@omne-harness/skill-host-local`\n\n格式沿 `claim` 技能 `references/spec-template.md`，方法 Matt `to-spec`。只写差额，共用部分引用。\n\n- 卡：无卡，负责人 2026-11-03 会话内「W2 开工」；波包 [w2/wave-pack.md](../wave-pack.md)；F `b0f2ec7fb15a3f8572a36ef71af2fd30bf90ca01`\n- 上一层：[线级地图](../../line-skill/context-map.md)；[共用约束](../../constraints.md)；[范式 r1](../../operating-model.md)；[W1 规格](../../w1/skill/spec.md)已定事项 1–15 继续有效\n- 主工作类型：feature → poteto-mode Feature\n- 风险级别：`w2-skill` L3（读取关口决定无权主体看到什么、依据能不能冒充访问、快照竞争能不能拼出两个版本）；`w2-skill-host` L2（只交字节，失败集合封闭，权限类失败用注入接缝测）\n\n## Problem Statement\n\nW1 之后，调用方拿到的只是接口：没有人能检查一个真实目录里的 Skill 包，也没有人能在核验读取权之后把正文或资源按页读出来。W3 的目录与导出、M2 之后的会话与 Agent 读取（#322）都要先有这两样。\n\n## Solution\n\n两个成员，三个工厂：\n\n- `@omne-harness/skill` 公开根导出 `createPackageInspection(source)` 与 `createSkillAccess(ports)`。前者经来源取一次一致的快照与两份控制文件字节，交给 `parseSkillPackage`。后者把[组页「读取」](../../../../packages/skills/docs/architecture.md#读取)的 11 步写成三段（`gate` → `pin` → `verifiedBytes`），四个操作各在自己那一步结束，失败类型逐段收窄。\n- `@omne-harness/skill-host-local` 公开根导出 `createDirectorySource(options?)`：只读当前目录、不缓存，链接与非常规文件按 SPEC 的来源失败集合答复，权限类失败经注入的文件系统接缝可测。\n- `skill-contract/testing` 可加 `skillAccessConformance()`：以后替换 `SkillAccess` 实现的人拿到同一组判据。\n\n## 依据与已定事项\n\n| 依据 | 精确修订 | 本规格采用的范围 |\n| --- | --- | --- |\n| 成员 SPEC `packages/skills/skill-contract/SPEC.md` | F | 「读取的形状规则」「需求端口」「快照」「检查 Skill 包」全节；失败集合 |\n| 组页 `packages/skills/docs/architecture.md` | F | 「端口」（含 `DirectorySource` 段与映射表）「应用服务」「检查与发现」「读取」 |\n| DDD 建模 `tmp/skill-mcp-domain/model/README.md` | 2026-11-03 本地 | 「Skill 上下文」应用服务三段结构；F6、F7、F8 |\n| 参考实现草图 `tmp/skill-mcp-domain/model/skill/access.ts` | 2026-11-03 本地 | 三段的分法与失败类型逐段扩大。它写在 W1 之前，与 F 的契约不一致处以契约为准 |\n| 契约源码 `skill-contract/src/{services,ports,failures,values,testing-source}.ts` | F | 接口签名、`createMemorySource`、`skillPackageSourceConformance` |\n| 官方 Agent Skills 规格 | https://agentskills.io/specification | 目录结构；正文从闭合定界行之后开始 |\n\n已定事项（reduce 裁定，写者照做）：\n\n1. **`createSkillAccess` 的端口参数**是一个对象 `SkillPorts<P, S> = { readCheck: SkillReadCheck<P, S>; resolution: SkillResolution<P, S>; source: SkillPackageSource }`。`createPackageInspection(source)` 只收来源。不收 `access`、不收作用域、不收配置。\n2. **`export` 提前到本波**（W1 波包写 W3）：它与 `read` 共用 `gate`、`pin` 与逐条目的 `verifiedBytes`，分开做反而要两次打开同一段代码。W3 的 `w3-skill-catalog` 只做 `SkillCatalog`。\n3. **三段结构固定**：`gate(access, scope, capability, basis?)` 做第 1–3 步，失败是 `DescribeFailure`；`pin(gateResult, signal?)` 做第 5、7 步，失败是 `PinFailure`；`verifiedBytes(pinned, path, signal?)` 做第 9–10 步，失败是 `ByteFailure`（`resource-missing`、`version-changed`、来源映射）。`describe` 在 `gate` 后结束，`list` 在 `pin` 后结束，`read` 与 `export` 走完三段。每段是一个导出的纯异步函数（只依赖端口参数），可以单独测。\n4. **`signal` 的检查点**是一个辅助函数 `checkpoint(signal)`，在每次调用端口之前与每次端口返回之后各调一次；已中止时操作答 `aborted`，不再调用端口，不交部分内容。`describe` 不收 `signal`。\n5. **正文起点**：`read` 正文时字节范围相对正文起点（闭合定界行的行终止符之后）。`skill-contract` 现有 `frontmatterOf` 只交出 YAML 文本，没有字节偏移。`w2-skill` 在 `skill-contract/src/parse/manifest.ts` **可加**导出 `bodyOffsetOf(bytes: Uint8Array): number | undefined`（没有合法头部时 `undefined`），并从公开根导出；`readManifest` 内部改用它取头部范围不算改行为，但现有用例必须原样通过。\n6. **字节范围的实现**按 SPEC「读取的形状规则」逐条：页上限 65536；文本条目的实际起点是不小于请求起点的第一个字符边界，终点前移到上一个字符边界；请求长度短于起点处一个字符时收成空范围并后移起点；起点或长度为负或非整数抛 `TypeError`；BOM 保留；`complete` 当且仅当实际终点不小于总长。文本条目的编码以快照条目的 `encoding` 为准；二进制每字节都是边界。\n7. **`inspect` 的控制文件读取**：`snapshot` 之后用 `open(locator, snapshot.digest, path)` 读 `SKILL.md`，`.omne/skill.json` 存在时也读；`parseSkillPackage` 收 `{ snapshot, control, expectedName }` 并自己核对控制文件字节的摘要（不符答 `version-changed`），`inspect` 不重复核对。来源答复映射：`package-not-found`/`entry-not-found`/`unavailable` → `source-unavailable`；`bytes-mismatch` → `version-changed`；`snapshot` 的 `entry-unreadable` → 拒绝 `malformed`；`snapshot` 或 `open` 的 `outside-package` → 拒绝 `outside-package`。\n8. **`describe` 的 `material`**：`SkillRef` 有内容摘要时 `pinned`，依据是 `{ capability, layer, version?, digest }`；没有时 `no-readable-package`。`describe` 不读字节。\n9. **无披露**：第 1 步依据的能力标识不等于目标时，对外 `not-available-to-you`；`SkillReadCheck` 答 `refused` → `not-available-to-you`；`SkillResolution` 答 `none` → `not-available-to-you`。三者对调用方不可区分，用例要证明三条路径的答复对象深度相等（除 `detail` 外没有字段差异；本波的 `not-available-to-you` 不带 `detail`）。\n10. **`skillAccessConformance()`**放在 `skill-contract/src/testing-access.ts`，形状同其他三个套件：`ConformanceCase<AccessFixture>[]`，`AccessFixture = { access: SkillAccess<P, S>; …已知的主体、作用域、能力与材料 }` 由实现方的工厂给出；内存替身由 `./testing` 已有的 `createMemorySource`、`createMemoryResolution`、`createMemoryReadCheck` 组装。至少覆盖：无披露三路径同答（A1–A3）、`basis-unavailable` 与 `adopted-material-changed` 的分野（A4、A5）、`version-changed` 不交新内容（A6）、`aborted` 不交部分内容（A7）、`unsupported`（A8）、范围规则（A9–A11）、`export` 不交部分包（A12）、`describe` 不读字节（A13，来源 `open` 抛出也成功）。\n11. **`createDirectorySource(options?)`**：`options.fs` 是文件系统接缝 `DirectoryFs`（`readdir`（带类型）、`lstat`、`realpath`、`readFile`），默认是 `node:fs/promises`。`PackageLocator` 用 `{ kind: 'directory', root }`；收到 `content-store` 定位答 `package-not-found`（本来源不持有按内容存放的包）。\n12. **`DirectorySource` 的失败映射**（W2 裁定，写进 host 成员 README「行为」节）：根目录不在或不是目录 → `package-not-found`；根目录不可读（EACCES、EIO）→ `unavailable`；条目是设备、管道、套接字，链接无法解析或成环，或条目不可读（EACCES）→ `entry-unreadable`；链接 `realpath` 落在根目录 `realpath` 之外 → `outside-package`（根目录自己是链接时，以它解析后的位置为根）；`open` 时文件不在 → `entry-not-found`，解析后落在根外 → `outside-package`，不可读 → `unavailable`。空目录与隐藏文件都是普通条目。`.omne` 目录照常进快照。\n13. **快照的条目集合**：递归目录下的全部文件（含 `.omne/skill.json`、`SKILL.md`），路径用 `/` 分隔的包内相对路径，交给 `sealSnapshot(rootName, files)`，`rootName` 是根目录（解析后）的最后一段。目录不是条目。\n14. **竞争**：`open` 读此刻的字节，不比对快照；字节是否变了由 Skill 核对。host 成员的测试要有「取快照后改文件再 open」的用例，证明来源原样交出新字节（Skill 一侧报 `version-changed` 的用例在 `w2-skill`）。\n15. **内存替身只能装进测试**：`@omne-harness/skill` 的测试用 `./testing` 的三个替身；`skill-host-local` 的符合性测试用真实临时目录（`node:fs` 的 `mkdtemp`）。\n16. **类/函数**：三段与四个操作都是函数；`createSkillAccess` 返回对象字面量。无类、无 `as`（`as const` 除外）、无 `any`。品牌只由契约的守卫授予。\n\n## 原则与约束\n\n| ub-mode 条目 | 本规格的取舍 |\n| --- | --- |\n| 先做对 | 读取 11 步逐步对应用例；每步的失败分支都有变红证据后再优化 |\n| 其余 | 按 ub-mode 全文 |\n\n| 判断或约束 | 拥有者 | 本规格的具体条目 |\n| --- | --- | --- |\n| 轴与拥有者 | `engineering-taste.md`「维度分解与正交」 | 三条轴：访问判定（端口拥有）、材料一致性（Skill 拥有：快照摘要与条目摘要核对）、字节来源（host 拥有）。Skill 不让字节来源决定访问判定 |\n| 领域边界 | `layers-and-dependencies.md` | 无新增外域概念；`Access<P>`、`CapabilityId` 继续经契约引入 |\n| 面向契约 | 成员 SPEC | `w2-skill` 实现 SPEC「读取的形状规则」与组页「读取」；`contract:` 级别 candidate |\n| 防御与失败语义 | `docs/defensive-patterns.md` | 见下 |\n| 演进政策 | `publication.md` | 没有被替代实现；新增消费者是本组自己的测试 |\n\n### 跨域概念的五问\n\n不适用：本波不新增跨域概念、公开字段或端口。\n\n### 失败语义\n\n| 情形 | 行为 | 由谁负责 | 怎样验证 |\n| --- | --- | --- | --- |\n| 正常 | 四个操作按 11 步答结果 | `skill` | 服务 + 内存替身的用例 |\n| 失败 | 每步失败按映射表答封闭集合中的一种，不吞成空结果 | `skill` | 每种失败一条用例；变异杀死映射改错 |\n| 未知 | 端口答 `unknown` → `unknown`，不压成拒绝或空 | `skill` | 用例 |\n| 取消与清理 | `aborted`，不交部分内容；没有资源要清理 | `skill` | A7 |\n| 外部效果 | 无。`DirectorySource` 只读 | `skill-host-local` | 符合性套件 |\n\n可配置的策略：无（页上限不可配置，SPEC 已定）。\n\n## User Stories\n\n1. 作为来源或资产登记一侧，我要把一个目录交给 `inspect`，得到 `SkillDefinition` 或按次序的第一个拒绝原因，以便登记合法的包、拒绝非法的包。\n2. 作为读者，我要 `describe` 一个能力，得到声明与材料依据，而不触碰包字节，以便决定要不要读正文。\n3. 作为读者，我要按页读正文或某个资源，每页知道实际范围与是否读完，以便在上下文预算内拼出完整内容。\n4. 作为读者，我要带依据读到当初那一份材料，或得到 `basis-unavailable`，以便不把旧正文与新资源拼成成功。\n5. 作为无权主体，我得到的答复不随身份是否存在而变，以便没有人能靠报错探测别的租户有什么。\n6. 作为导出方，我要一次拿到整包且每个条目都核对过，或一个失败，以便物化的包不是半份。\n7. 作为宿主装配者，我要一个只读目录的来源实现，并能用契约的符合性套件证明它合规，以便换别的来源时判据不变。\n8. 作为测试作者，我要用注入的文件系统制造权限失败，以便不靠 root 环境。\n\n## Implementation Decisions\n\n- `packages/skills/skill/src/`：`index.ts`（两个工厂与 `SkillPorts`）、`inspection.ts`、`access/gate.ts`、`access/pin.ts`、`access/bytes.ts`、`access/range.ts`（字节范围与字符边界）、`access/checkpoint.ts`、`access/service.ts`（四个操作的组合）、`mapping.ts`（端口答复到服务失败的映射表，一个表、一处）。\n- `packages/skills/skill-host-local/src/`：`index.ts`、`directory-source.ts`、`fs.ts`（`DirectoryFs` 接缝与 `node:fs/promises` 适配）、`walk.ts`（递归、链接解析、失败分类）。\n- `skill-contract` 可加：`parse/manifest.ts` 的 `bodyOffsetOf`；`testing-access.ts`、`testing.ts` 重导出。\n- 映射与次序以组页「读取」与「端口」映射表为准；两份规格形态一致，MCP 线同骨架。\n\n## Testing Decisions\n\n- 先写红：每个切片第一步是写会红的用例，红灯输出存进 `tmp/closures/<闭包>/red/`。\n- 测试接缝：服务 + 内存替身（`./testing`）；host 用真实临时目录 + 注入的 `DirectoryFs`；纯函数（范围、偏移）穷举。\n- 先例：`packages/skills/skill-contract/tests/`（套件用法）、`packages/tool/tool-contract`（符合性先例）。\n- 传感器与命令：同 [W1 规格](../../w1/skill/spec.md#testing-decisions)表；L3 热点（`gate.ts`、`mapping.ts`、`walk.ts` 的根外判定）由 reduce 逐行读并派 implementation-reviewer。\n- 不能声称的事：没有真实的 `SkillResolution`/`SkillReadCheck` 提供者（替身）；没有内容存储来源；没有并发读写同一目录的压力测试。\n\n## 判据\n\n| ID | 判据 | 证据 |\n| --- | --- | --- |\n| SK2-1 | `inspect` 对合法目录包答 `SkillDefinition`；对每种来源失败与快照缺陷按已定事项 7 映射 | 用例表；变异杀死映射 |\n| SK2-2 | 读取 11 步每个分支都有用例：第 1 步 `bad-basis`、第 2 步三种答复、第 3 步五种答复、第 5 步 `unsupported`、第 7 步两种摘要不符、第 9 步 `resource-missing`、第 10 步 `version-changed` 与四种来源失败 | 用例名对应步号 |\n| SK2-3 | 无披露：三条路径答复深度相等；对无权主体，存在与不存在的能力同答 | A1–A3 |\n| SK2-4 | 字节范围：页上限、字符边界、空范围后移、BOM、`complete`、`TypeError` 六条各有用例；正文起点相对闭合定界行 | `range.spec.ts`；`bodyOffsetOf` 用例 |\n| SK2-5 | `skillAccessConformance()` 至少 13 条，`createSkillAccess` + 内存替身全绿；去掉第 2 步核验的变体使 A1 变红 | 套件 + 变红证据 |\n| SK2-6 | `aborted` 不交部分内容；`export` 任一条目不符答 `version-changed` 不交部分包 | A7、A12 |\n| SK2-7 | `describe` 不读字节：来源 `open` 抛出时 `describe` 仍成功 | A13 |\n| SK2-8 | `manifest.ts:47–55` 头部扫描边界夹具补齐，W1 存活的变异被杀 | 变异读数 |\n| SK2-9 | `createDirectorySource` 通过 `skillPackageSourceConformance()` 全部用例（真实临时目录） | 套件 |\n| SK2-10 | 链接：包内链接读所指字节；根外链接 → `snapshot` 答 `outside-package`；成环/悬空 → `entry-unreadable`；设备/管道/套接字 → `entry-unreadable` | 用例（套接字用 `net.createServer` 的 unix socket，平台不支持时该用例 `NotApplicable`） |\n| SK2-11 | 权限：注入 `DirectoryFs` 使 `readFile` 抛 EACCES → `entry-unreadable`（snapshot）/`unavailable`（open）；根目录 EACCES → `unavailable` | 用例，不依赖 root |\n| SK2-12 | 竞争：取快照后改文件，`open` 原样交出新字节 | 用例 |\n\n## 待决事项\n\n| 缺口 | 影响的切片 | 处置 |\n| --- | --- | --- |\n| 无 | — | — |\n\n## Out of Scope\n\n- `SkillCatalog`；内容存储来源；Cordis 契约；真实提供者；脚本执行；组页写回。\n\n## Further Notes\n\n- `model/skill/access.ts` 写于 W1 之前：它的 `CallMode` 类比与 `Resolution[]` 形状已过时，只取三段分法。\n- 两线规格同骨架；MCP 线见 [../mcp/spec.md](../mcp/spec.md)。\n", "skill-plan": "# W2 Skill 线交付计划：`@omne-harness/skill` 与 `@omne-harness/skill-host-local`\n\n格式沿 `claim` 技能 `references/plan-template.md`，方法 Matt `to-tickets`。与同目录 [spec.md](spec.md) 配套。\n\n## 进度总览\n\n进度：[□□□□□□□□□□] 0/6 切片已完成 · 更新 2026-11-03T17:50:00Z · head b0f2ec7fb\n当前：切片 01、05 第 2 步（写闭包规格）\n\n| 切片 | 交付的行为 | 对应判据 | 状态 |\n| --- | --- | --- | --- |\n| 01 | 一个目录包经 `createPackageInspection` 得到 `SkillDefinition` 或按次序的拒绝 | SK2-1 | 待做 |\n| 02 | `describe` 与 `gate`：无权主体三路径同答，依据核对，`material` 两态 | SK2-2（1–4 步）、SK2-3、SK2-7 | 待做 |\n| 03 | `read`、`list` 与 `pin`/`verifiedBytes`：摘要分野、`resource-missing`、`version-changed`、范围规则、`aborted` | SK2-2（5–11 步）、SK2-4、SK2-6 | 待做 |\n| 04 | `export` 与 `skillAccessConformance`；`manifest.ts` 夹具 | SK2-5、SK2-6、SK2-8 | 待做 |\n| 05 | `createDirectorySource` 过来源套件；链接与非常规文件 | SK2-9、SK2-10 | 待做 |\n| 06 | 权限接缝与竞争；示例 | SK2-11、SK2-12 | 待做 |\n\n| 闭包 | 写者模型@档位 | 清晰度 | 工作树 | 分支 | 状态 | 轮次 | 追加 | 验收报告 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| w2-skill（切片 01–04） | claude-fable-5-1@high | 定 | `.worktrees/w2-skill` | `PanQiWei/skill-mcp-w2-skill` | 待派 | 0 | 0 | — |\n| w2-skill-host（切片 05–06） | claude-opus-5-5@high | 定 | `.worktrees/w2-skill-host` | `PanQiWei/skill-mcp-w2-skill-host` | 待派 | 0 | 0 | — |\n\n## 角色与模型分配\n\n本会话宿主：Claude Code（云），模型 claude-fable-5-1。派发做法按 `delegate`「选模型」；钉值来自 `render_pair.py --resolve claude_code --policy-version 947.1`。\n\n| 切片或环节 | 工作性质与复杂度 | 清晰度 | 角色 | 模型与 effort | 理由 |\n| --- | --- | --- | --- | --- | --- |\n| 调度 | 规格、计划、简报、裁定、读 diff、L3 逐行读 | — | 本会话 | fable | 全局上下文 |\n| 01–04 | 能力实现；读取关口安全敏感（无披露、依据） | 定 | developer，product | claude-fable-5-1，high | 策略 `security-sensitive` → 顶档，最低 high |\n| 05–06 | 单成员提供者，规格完整；接缝设计有判断 | 定 | developer，product | claude-opus-5-5，high 不相交。\n- 只依赖 F；不读 MCP 线。\n", "mcp-spec": "# W2 MCP 线实施规格：`@omne-harness/mcp` 核心\n\n格式沿 `claim` 技能 `references/spec-template.md`，方法 Matt `to-spec`。只写差额，共用部分引用。与 [Skill 线规格](../skill/spec.md)同骨架。\n\n- 卡：无卡，负责人 2026-11-03 会话内「W2 开工」；波包 [w2/wave-pack.md](../wave-pack.md)；F `b0f2ec7fb15a3f8572a36ef71af2fd30bf90ca01`\n- 上一层：[线级地图](../../line-mcp/context-map.md)；[共用约束](../../constraints.md)；[范式 r1](../../operating-model.md)；[W1 规格](../../w1/mcp/spec.md)已定事项 1–19 继续有效；[2026-07-28 核对](../schema-check.md)\n- 主工作类型：feature → poteto-mode Feature\n- 风险级别：L3。连接键决定不同租户与对端账号永不共用连接；凭据句柄的取得与释放（S9）；并发 `refresh` 的发布边界（迟到结果不覆盖较新的采用）\n\n## Problem Statement\n\nW1 之后 MCP 只有纯函数与接口。没有人能在替身端口上建立一条连接、发现对端的动作清单并整份发布，也没有人能回答「这个接入点现在什么状态」。W3 的调用口与真实传输、M2 之后的工具派生都要先有这层核心。\n\n## Solution\n\n`@omne-harness/mcp` 公开根导出 `createMcpCore(ports, config)`，交出五个服务里的四个（`inspection`、`discovery`、`status`、`connections`），它们共享一张连接表；另导出 `createInMemoryCatalogStore()`（生产可用的内存存储，过 CS 套件）。内部是两个有状态聚合（`Connection`、`InFlightCalls`，类）、一个关口（`admit`，纯函数加端口调用）与四个服务模块。`ActionInvoker` 与任务表在 W3 接在同一张连接表与在途表上。\n\n## 依据与已定事项\n\n| 依据 | 精确修订 | 本规格采用的范围 |\n| --- | --- | --- |\n| 成员 SPEC `packages/mcp/mcp-contract/SPEC.md` | F | K1–K3、C1–C8、R1–R7、S1–S9、AV/UE/CU/PL/CS/T 全节、失败码索引 |\n| 组页 `packages/mcp/docs/architecture.md` | F | 「MCP 连接」（状态机两张图、不变式 1–6、`close()` 次序）「MCP 动作清单与 MCP 已知动作」「应用服务」（读口、状态口、资格与换代） |\n| DDD 建模 `tmp/skill-mcp-domain/model/README.md` | 2026-11-03 本地 | 「MCP 上下文」聚合表、`invoke` 次序骨架（W3）、测试接缝；F1–F5 |\n| 聚合草图 `tmp/skill-mcp-domain/model/mcp/{connection,in-flight,gate}.ts` | 2026-11-03 本地 | 形状的起点。写在 W1 之前，与 F 的契约不一致处以契约为准 |\n| 契约源码 `mcp-contract/src/{services,ports,transport,catalog,listing,keys,outcomes}.ts` 与 `./testing` | F | 接口签名、五个替身、`conformanceCase` |\n| 2026-07-28 核对 | [schema-check.md](../schema-check.md) | 本波只受 `serverInfo` 可选一项影响（已 prep2） |\n\n已定事项（reduce 裁定，写者照做）：\n\n1. **公开根只有两个工厂与它们的类型**：`createMcpCore<P, S>(ports: McpPorts<P, S>, config: McpConfig<P>): McpCore<P, S>`，`McpCore = Omit<McpServices<P, S>, 'invoker'>`；`createInMemoryCatalogStore(): CatalogStore`。`createMcp` 在 W3 加上 invoker 后导出。聚合、关口、连接表不从公开根导出，但以成员内模块（`src/internal/`）的形式留给 W3。\n2. **`McpConfig` 校验**在 `createMcpCore` 入口：三个上界不是正的安全整数、`principalKey` 不是函数时抛 `RangeError`（S3）。\n3. **`Connection` 聚合是类**，只做状态转移，不做 IO：`state`（S7 的五态加 `closed`）、`generation`、`key`、`peer?`、`residual?`。构造时给 `GenerationPolicy`：`on-attempt`（stdio，每次 `attempt()` 加一，含失败）或 `on-negotiation`（HTTP，`ready()` 时加一）。非法转移抛 `TypeError`（编程错误）：`closed` 之后任何转移；`degraded` 只能由 `ready` 进入；`ready` 只能由 `preparing` 或 `degraded` 进入。`isCurrent(generation)` 判断迟到结果。\n4. **`InFlightCalls` 聚合是类**（本波只建不接调用口）：键 `(tenant, principalKey, correlationKey)`；`reserve` 查重与占位一步；`markSent(key, requestId, generation)`；`markEnded`；`cancel(key)` 的答复按 S2（`signalled` / `no-call-in-flight` / `unknown`）；`release(key)` 撤销占位。代际已换的键 `cancel` 答 `unknown`。表项在本次运行内保留，`ended` 状态不删除。\n5. **关口 `admit(ports, access, ref)`**：S1 的次序（`AdoptionView.endpoint` → 未采用 `not-available-to-you`、不可读 `unknown` → `UseEligibility.check` → `not-eligible` 为 `not-available-to-you`、被挡下为 `blocked`、`unknown`）。成功交出能力令牌 `AdmittedEndpoint`：带 `AdoptedEndpoint` 与一个模块私有品牌（`unique symbol`），只能由 `admit` 造出；需要连接的内部函数只收 `AdmittedEndpoint`，所以编译期就保证先过关口。`admitWithoutEligibility` 给任务操作复用连接的路径（S1 例外，W3 用）。\n6. **连接表**键是 `connectionKeyOf(tenant, holding, adoptionRevision, peerAccount)`（K2）的规范文本；一张 `Map`。`ensure(admitted, { connectBound? })`：\n   1. `peerAccountOf(auth, binding)`；缺凭据 → `credential-unavailable(missing)`（K1）。\n   2. 组键；表里有且状态是 `ready`/`degraded` → 复用。状态是 `lost`/`none` → 重建（新代际）。`preparing` 在途 → 等同一 promise（单飞）。\n   3. S4 配值检查：target、credential、connect-timeout、env，只报第一项。\n   4. 新建：`Connection.attempt()`（stdio 先加代际）→ `auth` 不是 `none` 时 `CredentialUse.acquire(purpose)`（stdio 用 `process-env`，HTTP 用 `http-authorization` 带 target）→ stdio 经 `ProcessLanding.start(env)` 取进程句柄 → `McpTransportFactory.open(material)` → `transport.discover()` → `Connection.ready(peer)`。任一步失败：按 R6 答 `ConnectionFailure`，连接转 `lost` 带 S7 原因，`residual` 按进程 `stop()` 的确认范围，进程凭据句柄立即释放（S9），`markUnavailable` 写入清单（写入冲突 → 保留，不可用 → 不报）。\n   5. 连接时限：从第 4 步开始计时，覆盖到 `ready`；超时按 `connection-unavailable` 处理并收口已起的进程。用 `AbortSignal.timeout(connectTimeout)` 组合 `connectBound`。\n7. **`discovery.refresh`**（S5）：`admit` → `ensure` 取连接 `(transport, generation)` → `store.read(catalogKey)` 得 `basedOn`（`absent` 或修订）→ 循环 `transport.listActions(cursor)` 至多 `maxListingPages` 页，任一页 `TransportFailure` 按 S5 分类 → `completeListing({ pages, basedOn, acquiredAt, maxPages, maxActions })` → 缺陷答 `kept(listing-incomplete)` → `mergeListing(current, listing)` → `stale-revision` 答 `kept(superseded)` → **发布边界**：连接代际仍是当前（`connection.isCurrent(generation)`）、`signal` 未中止、`UseEligibility.check` 仍 `granted`（否则答对应 `Refusal` 不发布）→ `store.write(key, record, expected: basedOn)` → `revision-conflict` 答 `kept(superseded)`、`unavailable` 答 `unknown` → `published(revision)`。两次并发 `refresh` 的用例必须出现一次 `published` 一次 `kept(superseded)`，且存储里是较新的那份。\n8. **`discovery.current`**：`admit` → 读 `store`（`absent` → `not-acquired`）→ `basisCurrent` 比较采用依据与当前连接（S8）；不连接、不发现；`ReadFailure` 收窄。`discovery.peer`：`admit` → 连接表没有 `ready`/`degraded` 连接答 `not-connected`；不为回答而建连接。\n9. **`status.inspect`**：`admit` 的变体——未采用答 `not-available-to-you`，`unknown` 答 `unknown`；有资格但被挡下不是失败，写进 `use: blocked`。视图：连接状态（含 `residual`）、凭据四态（S7：`auth` 为 `none` → `not-required`；配值 `absent`/`invalid`/`present` 按 `AdoptedEndpoint.settings` 三态）、`use`。`status.list`：`AdoptionView.endpoints(scope)` → 逐项资格，只列 `granted` 与被挡下的（被挡下进 `use: blocked`），`not-eligible` 不列；任一 `unknown` 整次 `unknown`。\n10. **`connections.release`**：`admit`（被禁用答 `blocked` 可接受，S1）→ 连接表有连接则 `close()` 次序（组页「`close()` 按下面的次序收场」）：拒新请求 → `transport.close()` → stdio `process.stop()` → 报告确认范围；`stop()` 答 `root-only`/`unconfirmed` 时状态 `lost(close-unconfirmed)` 带 `residual`，答 `tree-confirmed` 回到 `none`；HTTP 凭据句柄随关闭释放。没有连接答 `no-connection`。`closeAll()` 对表里每条做同样的事，只报告确认范围，不核采用。\n11. **撤采用与禁用的自动关闭**（S1 末句、不变式 6）：每次 `ensure`/`admit` 发现采用修订变了（键不同）或资格不是 `granted` 时，先关闭旧键或该接入点的连接（同 10 的次序），再继续。本波不做后台轮询。\n12. **凭据句柄生命周期**（S9）：每条连接一个进程凭据句柄；在进程 `stop()` 返回后释放；准备失败立即释放。HTTP 句柄随连接关闭释放。用例用替身的句柄计数证明「释放恰好一次」。\n13. **`createInMemoryCatalogStore`** 是生产内存实现，不是 `./testing` 的替身：按 `catalogKey` 规范文本存整份记录，CS1–CS8 全过（CS7 由键隔离保证）；没有 `unavailable` 的路径（内存永远可用），CS8 用例 `NotApplicable`。\n14. **`inspection`**：`mcpEndpointBodyContract()` 加 `inspect(body)`（`parseEndpointBody`）与 `launchesLocalCommand(body)`，三者共享一份正文读取，不重复解析规则。\n15. **脚本化传输替身**只在本成员测试里：`tests/doubles/scripted-transport.ts` 给出 `McpTransportFactory` 替身，每次 `open` 交出一个按脚本应答的 `McpTransport`，脚本项可以是立即值、`TransportFailure` 或一个可由测试在稍后 resolve 的 deferred（用来排并发次序）。替身记录每次调用，用例断言调用序列。\n16. **类/函数**：只有 `Connection`、`InFlightCalls`、内存存储（可用闭包或类）是有状态的；服务是返回对象字面量的工厂函数。无 `as`（`as const` 除外）、无 `any`。品牌只由契约守卫或 `admit` 授予。\n17. **不做**：任何真实传输、SDK、任务表、`invoke`；`list_changed` 订阅（`changedNotified` 保持为假）；后台重连。\n\n## 原则与约束\n\n| ub-mode 条目 | 本规格的取舍 |\n| --- | --- |\n| 先做对 | 状态机与发布边界先有用例；并发用例用 deferred 排次序，不用 sleep |\n| 其余 | 按 ub-mode 全文 |\n\n| 判断或约束 | 拥有者 | 本规格的具体条目 |\n| --- | --- | --- |\n| 轴与拥有者 | `engineering-taste.md` | 四条轴：采用与资格（端口拥有）、连接生命周期（`Connection` 拥有）、清单采用（纯函数拥有，服务只做发布边界）、凭据与进程（端口拥有，服务只管句柄的取得与释放时点）。服务不让清单结果决定连接状态 |\n| 领域边界 | `layers-and-dependencies.md` | 无新增外域概念 |\n| 面向契约 | 成员 SPEC | 实现 S1、S3–S5、S7–S9、K1–K3、C 系列的调用方义务；`contract:` candidate |\n| 防御与失败语义 | `docs/defensive-patterns.md` | 见下 |\n| 演进政策 | `publication.md` | 无被替代实现 |\n\n### 跨域概念的五问\n\n不适用：本波不新增跨域概念。\n\n### 失败语义\n\n| 情形 | 行为 | 由谁负责 | 怎样验证 |\n| --- | --- | --- | --- |\n| 正常 | `refresh` 整份发布；`current`/`peer`/`inspect` 不连接 | `mcp` | 服务 + 替身用例 |\n| 失败 | 每条 R1/R6/R7 的失败按条件给出；失败时保留原采用，`markUnavailable` 只在连接类失败 | `mcp` | 每条一例；变异 |\n| 未知 | `effect-unknown` 带子因；存储不可用 `unknown`；不压成失败 | `mcp` | 用例 |\n| 取消与清理 | `signal` 在发布边界核对；`close()` 只报告确认范围；`residual` 原样记 | `mcp` | 用例：`stop()` 答 `unconfirmed` 时状态 `lost(close-unconfirmed)` |\n| 外部效果 | 进程启动与传输打开是外部效果；关闭不声称可逆 | `mcp` | 替身计数 |\n\n可配置的策略：`McpConfig` 四项（必填无缺省）。连接时限来自采用配值或 `connectBound`。\n\n## User Stories\n\n1. 作为宿主装配者，我要用五个端口与一份配置得到四个核心服务，以便 W3 接上调用口而不改装配。\n2. 作为读者，我要 `refresh` 一次就得到整份发布的清单或保留原采用的原因，以便不把半份清单当成全部。\n3. 作为读者，我要并发 `refresh` 时较晚的结果不覆盖较新的采用，以便迟到刷新不回退。\n4. 作为无权主体，我对任何接入点得到同一个答复，以便探不到别的租户的接入点。\n5. 作为运维，我要 `inspect` 看到连接状态、残留进程与凭据有无，但看不到凭据值。\n6. 作为宿主，我要 `closeAll` 只报告确认停止的范围，以便退出时知道还有什么没停。\n7. 作为凭据拥有者，我要每条连接恰好取一次、用完释放一次的句柄，以便秘密不多留。\n\n## Implementation Decisions\n\n- `packages/mcp/mcp/src/`：`index.ts`、`config.ts`、`internal/connection.ts`、`internal/in-flight.ts`、`internal/gate.ts`、`internal/table.ts`（连接表与 `ensure`、`close`）、`discovery.ts`、`status.ts`、`connections.ts`、`inspection.ts`、`store/memory.ts`。\n- `tests/`：`connection.spec.ts`（状态机穷举）、`in-flight.spec.ts`、`gate.spec.ts`、`ensure.spec.ts`、`refresh.spec.ts`（含并发）、`status.spec.ts`、`release.spec.ts`、`memory-store.spec.ts`（跑 `mcpCatalogStoreConformance`）、`doubles/scripted-transport.ts`。\n- W3 接入点：`internal/table.ts` 的 `ensure`、`internal/in-flight.ts`、`internal/gate.ts` 的 `admitWithoutEligibility`。写者在成员 README「给下一波」节写明这三处的签名。\n\n## Testing Decisions\n\n- 先写红；红灯输出存 `tmp/closures/w2-mcp-core/red/`。\n- 接缝：服务 + 五个契约替身 + 脚本化传输；聚合状态机穷举；内存存储过 CS 套件。\n- 先例：`mcp-contract/tests/conformance.spec.ts`（套件用法）。\n- 传感器与命令：同 [W1 规格](../../w1/mcp/spec.md#testing-decisions)表；L3 热点（`gate.ts`、`table.ts` 的键与句柄释放、`refresh` 发布边界）由 reduce 逐行读并派 implementation-reviewer。\n- 不能声称的事：没有真实传输与真实进程；连接时限只用假时钟/`AbortSignal.timeout` 的小值测；没有跨进程故障。\n\n## 判据\n\n| ID | 判据 | 证据 |\n| --- | --- | --- |\n| MC2-1 | `createMcpCore` 对不合法 `McpConfig` 抛 `RangeError`；合法时交出四个服务 | 用例 |\n| MC2-2 | `Connection` 两种代际策略的每个合法转移与每个非法转移都有用例；迟到代际被拒 | `connection.spec.ts` |\n| MC2-3 | `InFlightCalls`：占位查重一步、同租户同主体才能取消、不在表答 `unknown`、代际已换答 `unknown`、占位后发出前取消则不发出 | `in-flight.spec.ts` |\n| MC2-4 | `admit` 的六种答复各一例；`AdmittedEndpoint` 不能在模块外构造（类型测试 + 运行时） | `gate.spec.ts`、`types.spec-d.ts` |\n| MC2-5 | `ensure`：复用、重建、单飞、S4 四种配值缺陷、R6 四种连接失败各一例；失败后 `markUnavailable` 已写入且原采用不变；进程凭据句柄在失败时立即释放 | `ensure.spec.ts`；替身计数 |\n| MC2-6 | `refresh`：`published`；`kept` 三种原因各一例；并发两次只一次 `published`，存储是较新的；发布边界的三项核对（代际、取消、资格）各一例 | `refresh.spec.ts` |\n| MC2-7 | `current` 与 `peer` 不调用传输工厂（替身计数为 0）；`basisCurrent` 三态 | 用例 |\n| MC2-8 | `status.inspect`/`list`：凭据四态、`use` 两态、`residual` 出现在 `lost`；`not-eligible` 不进 `list`；对无权主体存在与不存在同答 | `status.spec.ts` |\n| MC2-9 | `release`/`closeAll`：`close()` 次序（替身调用序列）；`stop()` 三种范围对应的状态与报告；HTTP 句柄释放恰好一次 | `release.spec.ts` |\n| MC2-10 | `createInMemoryCatalogStore` 过 `mcpCatalogStoreConformance()`（CS8 `NotApplicable`）；跨租户、跨对端账号、跨持有互不可见 | 套件 |\n\n## 待决事项\n\n| 缺口 | 影响的切片 | 处置 |\n| --- | --- | --- |\n| 无 | — | — |\n\n## Out of Scope\n\n- `ActionInvoker`、任务表、真实传输、SDK、`list_changed` 订阅、后台重连、Cordis、组页写回。\n\n## Further Notes\n\n- `model/mcp/connection.ts` 等草图写于 W1 之前：`CallMode` 相关内容已删，只取聚合分法与不变式。\n- W3 的契约可加调整清单在 [schema-check.md](../schema-check.md)，本波不动契约。\n", "mcp-plan": "# W2 MCP 线交付计划：`@omne-harness/mcp` 核心\n\n格式沿 `claim` 技能 `references/plan-template.md`，方法 Matt `to-tickets`。与同目录 [spec.md](spec.md) 配套。\n\n## 进度总览\n\n进度：[□□□□□□□□□□] 0/5 切片已完成 · 更新 2026-11-03T17:50:00Z · head b0f2ec7fb\n当前：切片 01 第 2 步（写闭包规格）\n\n| 切片 | 交付的行为 | 对应判据 | 状态 |\n| --- | --- | --- | --- |\n| 01 | 两个聚合与关口：状态机穷举、在途表、`admit` 与能力令牌；`McpConfig` 校验 | MC2-1–MC2-4 | 待做 |\n| 02 | 连接表与 `ensure`：复用、重建、单飞、配值与连接失败、句柄释放；内存存储过 CS 套件 | MC2-5、MC2-10 | 待做 |\n| 03 | `refresh`、`current`、`peer`：整份发布、保留原因、并发发布边界 | MC2-6、MC2-7 | 待做 |\n| 04 | `status` 与 `connections`：视图四态、`close()` 次序、`residual`、`closeAll` | MC2-8、MC2-9 | 待做 |\n| 05 | `inspection`、`createMcpCore` 组装、README「给下一波」 | MC2-1 | 待做 |\n\n| 闭包 | 写者模型@档位 | 清晰度 | 工作树 | 分支 | 状态 | 轮次 | 追加 | 验收报告 |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| w2-mcp-core（切片 01–05） | claude-fable-5-1@high | 定 | `.worktrees/w2-mcp-core` | `PanQiWei/skill-mcp-w2-mcp-core` | 待派 | 0 | 0 | — |\n\n五个切片写同一成员，合成一个闭包，一个写者按 01→05 顺序做。\n\n## 角色与模型分配\n\n同 [Skill 线计划](../skill/plan.md#角色与模型分配)。本闭包命中策略 `security-sensitive`（连接键隔离、凭据句柄）与并发（发布边界），顶档 claude-fable-5-1，effort high（不是 hardest：没有内核原语）。\n\n## 切片\n\n### 01：聚合与关口\n\n- **交付：** `Connection
