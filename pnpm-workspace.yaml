packages:
  - packages/*/*
  - apps/*
  - tools/repo-toolchain
  - tools/dev-flow
  - tools/product-checks
  - tools/test-runner
  - tools/artifact-builder
  - tools/repo-config
  - tools/pqw-adapter

# 普通版本号只从 registry 解析，不链接到同名的工作区成员；工作区成员之间要链接就写 workspace:。
# 检查器的钉子依赖这一条：钉住的 repo-toolchain、repo-config 必须装 npm 上的包。
linkWorkspacePackages: false

# 版本只在这里钉一次；成员用 `catalog:` 引用。改版本先改这里，再重生锁文件。
catalog:
  # 检查器与配置预设：仓库检查运行 npm 上的这两个精确版本，不运行工作区 tools/ 下的同名成员。
  # 升级先发新版本，再开只改这两行的 PR，见 omne-card 技能的 references/toolchain-upgrade.md。
  '@omne-harness/repo-toolchain': 0.0.20
  '@omne-harness/repo-config': 0.0.7
  '@babel/helper-validator-identifier': 8.0.6
  validate-npm-package-name: 8.0.0
  '@types/validate-npm-package-name': 4.0.2
  '@earendil-works/pi-tui': 1.0.0
  '@deepseek-ai/cordis': 4.0.4
  '@huggingface/tokenizers': 0.2.0
  js-tiktoken: 1.0.21
  image-size: 2.0.4
  immutable: 5.1.9
  sharp: 0.35.3
  diff: 9.0.0
  node-pty: 1.1.0
  '@types/node': 24.13.6
  ajv: 8.20.0
  kysely: 0.29.6
  pg: 8.23.0
  '@types/pg': 8.15.6
  typescript: 7.0.2
  '@typescript/typescript6': 6.0.2
  vitest: 4.1.11
  oxfmt: 0.73.0
  oxlint: 1.88.0
  dependency-cruiser: 18.6.0
  knip: 6.41.0
  turbo: 2.11.7
  '@vitest/coverage-v8': 4.1.11
  zod: 4.6.5
  # 官方 MCP TypeScript SDK：mcp-host-local 只复用它的常量与帧的写法（client），测试用它的真实服务端夹具（server）；
  # node 把服务端挂到 node:http，只作测试依赖。哪些部分不复用及理由见 mcp-host-local 的 SPEC。
  '@modelcontextprotocol/client': 2.4.0
  '@modelcontextprotocol/server': 2.4.0
  '@modelcontextprotocol/node': 2.1.2
  # SSE 事件解析，与 SDK 用同一个实现：mcp-host-local 读 text/event-stream 的应答。
  eventsource-parser: 3.1.1
  # 官方参考 MCP 服务端：只作 mcp-host-local 的测试依赖，做生态兼容与回归的真实对端。
  '@modelcontextprotocol/server-everything': 2.1.0
  '@modelcontextprotocol/server-filesystem': 2.1.0
  '@standard-schema/spec': 1.1.0
  yaml: 2.9.1
  jsonc-parser: 3.3.1
  elkjs: 0.12.0
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  # session-ui：流式 Markdown、组件测试与它的 DOM 环境。
  streamdown: 2.7.1
  # ui-kit：控件、样式与流式 Markdown 的插件。版本取自参考项目锁文件里实际解析到的那一版；tailwind-merge 例外，沿用锁文件里已有的 3.7.0。
  radix-ui: 1.6.7
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  # 桌面应用的页面构建用它把 ui-kit 汇总样式里的 Tailwind 编出来；版本与 tailwindcss 相同。
  '@tailwindcss/vite': 4.3.3
  '@streamdown/cjk': 1.0.4
  '@streamdown/code': 1.1.1
  '@streamdown/math': 1.0.3
  '@streamdown/mermaid': 1.0.3
  katex: 0.16.27
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  happy-dom: 21.0.4
  '@xyflow/react': 12.12.0
  # 桌面应用页面的构建与界面测试（apps/desktop）。vite 取 vitest 已经装着的同一个版本，不另起一份。
  vite: 8.3.0
  '@vitejs/plugin-react': 6.3.0
  antd: 6.6.5
  # 桌面应用的 Electron 外壳（apps/desktop）。这个版本的包没有安装脚本：二进制在第一次起窗口时下载。
  electron: 45.3.2
  esbuild: 0.28.2
  '@eslint-community/regexpp': 4.12.2
  '@jscpd/core': 4.0.1
  '@jscpd/tokenizer': 4.0.1
  '@stryker-mutator/api': 10.1.1
  '@stryker-mutator/core': 10.1.1
  '@stryker-mutator/vitest-runner': 10.1.1

# 安装仍使用 --ignore-scripts；只允许显式构建这个已核对的原生依赖。
onlyBuiltDependencies:
  - node-pty@1.1.0

# node-pty 1.1.0 的 macOS 预编译包里 spawn-helper 没有可执行位，postinstall 也不补；补丁只把它改成 0755。
patchedDependencies:
  node-pty@1.1.0: patches/node-pty@1.1.0.patch
  rrule@2.8.1: patches/rrule@2.8.1.patch

# dependency-cruiser 18 只认 TypeScript 6 以下的编译器，没有它就不解析 .ts。只给它补一份 TypeScript 6，成员仍用 catalog 的 TypeScript 7。
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
