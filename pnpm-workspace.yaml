packages:
  - packages/*/*
  - apps/*
  - tools/repo-toolchain
  - tools/dev-flow
  - tools/product-checks
  - tools/test-runner
  - tools/artifact-builder
  - tools/repo-config

# 普通版本号只从 registry 解析，不链接到同名的工作区成员；工作区成员之间要链接就写 workspace:。
# 检查器的钉子依赖这一条：钉住的 repo-toolchain、repo-config 必须装 npm 上的包。
linkWorkspacePackages: false

# 版本只在这里钉一次；成员用 `catalog:` 引用。改版本先改这里，再重生锁文件。
catalog:
  # 检查器与配置预设：仓库检查运行 npm 上的这两个精确版本，不运行工作区 tools/ 下的同名成员。
  # 升级先发新版本，再开只改这两行的 PR，见 docs/development.md「仓库工具链的版本」。
  '@omne-harness/repo-toolchain': 0.0.13
  '@omne-harness/repo-config': 0.0.3
  '@babel/helper-validator-identifier': 8.0.6
  validate-npm-package-name: 8.0.0
  '@types/validate-npm-package-name': 4.0.2
  '@earendil-works/pi-tui': 1.0.0
  '@deepseek-ai/cordis': 4.0.4
  '@huggingface/tokenizers': 0.2.0
  js-tiktoken: 1.0.21
  image-size: 2.0.4
  immutable: 5.1.9
  sharp: 0.35.3
  diff: 9.0.0
  node-pty: 1.1.0
  '@types/node': 24.13.6
  ajv: 8.20.0
  kysely: 0.29.6
  pg: 8.23.0
  '@types/pg': 8.15.6
  typescript: 7.0.2
  '@typescript/typescript6': 6.0.2
  vitest: 4.1.11
  oxfmt: 0.73.0
  oxlint: 1.88.0
  dependency-cruiser: 18.6.0
  knip: 6.41.0
  turbo: 2.11.7
  '@vitest/coverage-v8': 4.1.11
  zod: 4.6.5
  '@standard-schema/spec': 1.1.0
  yaml: 2.9.1
  jsonc-parser: 3.3.1
  elkjs: 0.12.0
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@xyflow/react': 12.12.0
  antd: 6.6.5
  esbuild: 0.28.2
  '@eslint-community/regexpp': 4.12.2
  '@jscpd/core': 4.0.1
  '@jscpd/tokenizer': 4.0.1
  '@stryker-mutator/api': 10.0.0
  '@stryker-mutator/core': 10.0.0
  '@stryker-mutator/vitest-runner': 10.0.0

# 安装仍使用 --ignore-scripts；只允许显式构建这个已核对的原生依赖。
onlyBuiltDependencies:
  - node-pty@1.1.0

# dependency-cruiser 18 只认 TypeScript 6 以下的编译器，没有它就不解析 .ts。只给它补一份 TypeScript 6，成员仍用 catalog 的 TypeScript 7。
packageExtensions:
  dependency-cruiser:
    dependencies:
      typescript: 6.0.3
