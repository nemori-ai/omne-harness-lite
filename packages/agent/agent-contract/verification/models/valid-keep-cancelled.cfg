\* Positive control on the reading of the memory Journals: the scope of valid-cancel with
\* SupersedeStaleCancelled = FALSE, so establish-cancellation never replaces a cancelled candidate.
\* It checks that the safety properties do not depend on that constant (../formal-mapping.md).
SPECIFICATION Spec
CONSTANTS
  Bugs = {}
  Scope = {"tool", "card", "legacy", "held"}
  Coordinated = FALSE
  Handoffs = 2
  MaxInputs = 2
  MaxF1 = 1
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = FALSE
  Observe = TRUE
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  NoEndWithPending
  UnknownNotBlockedOrEnded
  CancelFirst
  NoEndOutsideSettling
  NoStaleJudgment
  OneCustodian
  ReplayOriginal
PROPERTIES
  PointerByJa
