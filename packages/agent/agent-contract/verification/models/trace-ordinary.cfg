\* Trace export: a simulation of the replay steps until an ordinary end.
SPECIFICATION TraceSpec
CONSTANTS
  Bugs = {}
  Scope = {"call"}
  Coordinated = FALSE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 2
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = FALSE
  Observe = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
  NotEndedOrdinary
