\* Reachability witness: after a crash lookup finds cards the process had not recorded, then the batch is applied.
SPECIFICATION Spec
CONSTANTS
  Bad = "none"
  Passages = {"p1", "p2"}
  Cards = {"c1", "c2"}
  MaxRounds = 2
  MaxCrash = 1
  MaxLoss = 1
  AllowCancel = TRUE
  AllowDeny = TRUE
INVARIANT
  NeverLookupAfterCrash
