  Coordinated = FALSE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 2
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = TRUE
  Observe = TRUE
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS
