\* Positive control of the liveness property under the fairness of LiveSpec on a coordinated
\* binding: the Model call, one internal H, the Session participant and a new Run after the cancel.
\* Premise: SupersedeStaleCancelled = TRUE. Under FALSE, the reading of the memory Journals,
\* probe-keep-cancelled gives a counterexample (../formal-runs.md).
SPECIFICATION LiveSpec
CONSTANTS
  Bugs = {}
  Scope = {"call", "newrun"}
  Coordinated = TRUE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 1
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = TRUE
  Observe = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
  CancelSettles
