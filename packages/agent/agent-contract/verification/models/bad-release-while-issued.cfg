\* Negative control of OneCustodian: the producer releases its copy while the call is still
\* issued, before any custody write. No action reads the result afterwards, so only a fact that
\* does not depend on the holder (the ghost `produced`) can show the result is left without one.
SPECIFICATION Spec
CONSTANTS
  Bugs = {"release-while-issued"}
  Scope = {"call"}
  Coordinated = FALSE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 2
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = TRUE
  Observe = TRUE
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS
  OneCustodian
