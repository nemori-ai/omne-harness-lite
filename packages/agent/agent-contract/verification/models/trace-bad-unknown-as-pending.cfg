\* Trace export: the shortest replay behavior that violates UnknownNotBlockedOrEnded under "unknown-as-pending".
SPECIFICATION TraceSpec
CONSTANTS
  Bugs = {"unknown-as-pending"}
  Scope = {"call"}
  Coordinated = FALSE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 2
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = FALSE
  Observe = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
  UnknownNotBlockedOrEnded
