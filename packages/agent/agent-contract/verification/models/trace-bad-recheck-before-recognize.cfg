\* Trace export: the shortest replay behavior that violates ReplayOriginal under "recheck-before-recognize".
SPECIFICATION TraceSpec
CONSTANTS
  Bugs = {"recheck-before-recognize"}
  Scope = {"call"}
  Coordinated = FALSE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 2
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = FALSE
  Observe = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
  ReplayOriginal
