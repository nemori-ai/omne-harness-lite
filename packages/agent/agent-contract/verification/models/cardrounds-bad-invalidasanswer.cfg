\* Negative control: read takes an invalidated card as the person's answer.
SPECIFICATION Spec
CONSTANTS
  Bad = "invalidasanswer"
  Passages = {"p1", "p2"}
  Cards = {"c1", "c2"}
  MaxRounds = 2
  MaxCrash = 1
  MaxLoss = 1
  AllowCancel = TRUE
  AllowDeny = TRUE
INVARIANT
  NoAnswerAfterInvalidate
