\* Negative control: after a crash, recovery hands back a round whose outcome is already committed.
SPECIFICATION Spec
CONSTANTS
  Bad = "rehandback"
  Passages = {"p1", "p2"}
  Cards = {"c1", "c2"}
  MaxRounds = 2
  MaxCrash = 1
  MaxLoss = 1
  AllowCancel = TRUE
  AllowDeny = TRUE
INVARIANT
  OnceHandBack
