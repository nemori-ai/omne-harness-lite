\* Positive control of the liveness property under the fairness of LiveSpec on a standalone
\* binding: the Tool association, the card round, the legacy candidate and a held write.
SPECIFICATION LiveSpec
CONSTANTS
  Bugs = {}
  Scope = {"tool", "card", "legacy", "held"}
  Coordinated = FALSE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 1
  MaxCrashes = 0
  MaxLost = 1
  SupersedeStaleCancelled = TRUE
  Observe = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
  CancelSettles
