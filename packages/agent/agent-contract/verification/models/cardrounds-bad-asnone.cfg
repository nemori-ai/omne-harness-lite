\* Negative control: after the end a requested round with an unknown receipt closes as no card, without lookup.
SPECIFICATION Spec
CONSTANTS
  Bad = "asnone"
  Passages = {"p1", "p2"}
  Cards = {"c1", "c2"}
  MaxRounds = 2
  MaxCrash = 1
  MaxLoss = 1
  AllowCancel = TRUE
  AllowDeny = TRUE
INVARIANT
  ClosedLeavesNoLiveCard
