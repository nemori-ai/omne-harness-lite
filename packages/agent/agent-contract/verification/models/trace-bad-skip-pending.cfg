\* Trace export: the shortest replay behavior that violates NoEndWithPending under "skip-pending".
SPECIFICATION TraceSpec
CONSTANTS
  Bugs = {"skip-pending"}
  Scope = {"call"}
  Coordinated = FALSE
  Handoffs = 1
  MaxInputs = 2
  MaxF1 = 2
  MaxCrashes = 1
  MaxLost = 1
  SupersedeStaleCancelled = FALSE
  Observe = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
  NoEndWithPending
