\* Positive control: P1-P5 and P7 on two keys with one ensure each and closeAll; lawful ports that may hang; no bound fires (CONSTRAINT). Under the constraint no rest is reached and no answer is late, so P1's shutdown clause, P6 and P8 T2 would hold vacuously and are checked on one key only.
SPECIFICATION Spec
CONSTANTS
  Keys = {"A", "B"}
  Ensures = 1
  Releases = 0
  CloseAlls = 1
  Loses = 0
  Deviations = {}
  Budget = 0
  Bugs = {}
  Observe = TRUE
VIEW View
CONSTRAINT NoBoundFired
CHECK_DEADLOCK FALSE
INVARIANTS
  P1_AtMostOnce
  P1_ReleasedAfterStop
  P2_ForgetHoldsNothing
  P2_NoneHoldsNothing
  P3_EveryProcessAsked
  P4_NoConnectAfterShut
  P4_NoOkAfterShut
  P16_CloseRefusesAtOnce
  P16_NoOkAfterClose
  P5_KeyIsolation
  P7_ErrorsHandled
