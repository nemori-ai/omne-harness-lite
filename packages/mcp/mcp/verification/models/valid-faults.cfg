\* Positive control: P1-P8 T2 on one key with ensure, release, lose and closeAll; one port call fails, rejects or answers unconfirmed.
SPECIFICATION Spec
CONSTANTS
  Keys = {"A"}
  Ensures = 1
  Releases = 1
  CloseAlls = 1
  Loses = 1
  Deviations = {"fail", "reject", "unconfirmed"}
  Budget = 1
  Bugs = {}
  Observe = TRUE
VIEW View
CHECK_DEADLOCK FALSE
INVARIANTS
  P1_AtMostOnce
  P1_ReleasedAfterStop
  P1_ShutdownReleasesAll
  P2_ForgetHoldsNothing
  P2_NoneHoldsNothing
  P3_EveryProcessAsked
  P4_NoConnectAfterShut
  P4_NoOkAfterShut
  P5_KeyIsolation
  P6_LateInvisible
  P7_ErrorsHandled
  P8_BoundedEnsure
