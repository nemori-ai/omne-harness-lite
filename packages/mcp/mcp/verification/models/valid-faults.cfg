  P1_AtMostOnce
  P1_ShutdownReleasesAll
  P2_ForgetHoldsNothing
  P2_NoneHoldsNothing
  P4_NoConnectAfterShut
  P4_NoOkAfterShut
  P16_CloseRefusesAtOnce
  P16_NoOkAfterClose
  P5_KeyIsolation
  P6_LateInvisible
  P7_ErrorsHandled
  P8_BoundedEnsure
