\* Positive control: P1, P2, P4-P8 T2 on one key with ensure, release, lose and closeAll; one port call fails or rejects.
SPECIFICATION Spec
CONSTANTS
  Keys = {"A"}
  Ensures = 1
  Releases = 1
  CloseAlls = 1
  Loses = 1
  Deviations = {"fail", "reject"}
  Budget = 1
  Bugs = {}
  Observe = TRUE
VIEW View
CHECK_DEADLOCK FALSE
