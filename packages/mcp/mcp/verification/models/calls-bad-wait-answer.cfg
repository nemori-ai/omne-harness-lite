\* Negative control (liveness): the wait for the peer's answer ignores the stop signal; the peer drops it. P14_EveryCallAnswers must fail.
SPECIFICATION LiveSpec
CONSTANTS
  Keys = {"A"}
  Callers = {"A"}
  Invokes = 1
  Continues = 0
  Cancellers = {"A"}
  Cancels = 1
  Taskers = {}
  Tasks = 0
  Aborts = 0
  Drops = 0
  CloseAlls = 0
  Peer = "complete"
  Deviations = {}
  Budget = 0
  Bugs = {"wait-answer-unstopped"}
  Observe = FALSE
CHECK_DEADLOCK FALSE
PROPERTY
  P14_EveryCallAnswers
