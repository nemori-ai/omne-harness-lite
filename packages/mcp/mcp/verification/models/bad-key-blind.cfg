\* Negative control: ensure finds the entry without its key, so a key whose build failed lends its entry to another key, which builds on it with its own credential (table.ts entryOf). P5_KeyIsolation must fail.
SPECIFICATION Spec
CONSTANTS
  Keys = {"A", "B"}
  Ensures = 1
  Releases = 0
  CloseAlls = 0
  Loses = 0
  Deviations = {"fail"}
  Budget = 1
  Bugs = {"key-blind"}
  Observe = TRUE
VIEW View
CHECK_DEADLOCK FALSE
CONSTRAINT NoBoundFired
INVARIANTS
  P5_KeyIsolation
