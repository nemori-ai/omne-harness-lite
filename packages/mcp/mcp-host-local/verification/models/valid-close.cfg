\* Positive control: two requests (one write), a handle, refusals, discovery and close().
SPECIFICATION Spec
CONSTANTS
  Reqs = {r1, r2}
  Writes = {r2}
  HasHandle = TRUE
  MaxSends = 2
  Bugs = {}
CHECK_DEADLOCK FALSE
INVARIANTS
  TypeOK
  V1_SettleOnce
  V2_NoCredentialAfterClose
  V3_RejectAtMostOnce
  V4_CloseBounded
  V4_SignalBounded
  V5_NoResendForCaller
  V6_ByPhase
