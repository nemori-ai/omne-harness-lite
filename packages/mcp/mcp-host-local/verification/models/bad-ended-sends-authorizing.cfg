\* Negative control: the session ended (404 for the old session, T8 S07) but the request still
\* authorizing was not settled, so the handle's answer hands it to the line; V2 (disconnect) must fail.
SPECIFICATION Spec
CONSTANTS
  Reqs = {r1, r2}
  Writes = {r2}
  HasHandle = TRUE
  MaxSends = 2
  Bugs = {"ended-leaves-authorizing"}
CHECK_DEADLOCK FALSE
INVARIANTS
  V2_NoWireAfterDead
