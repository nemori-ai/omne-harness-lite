\* N-W1: no anchor. The bridge is the only handle holder and KILL_ON_JOB_CLOSE
\* stays set. Expected: Refines is violated, because the death of the bridge
\* kills the retained processes with no stop in ProcessCustody.
SPECIFICATION Spec
CONSTANTS
    Units = {u1, u2}
    Cap = 1
    MaxRest = 1
    MaxCrash = 1
    Sessions = {s1, s2}
    MaxBridgeDeath = 1
    Anchor = FALSE
    ClearOnHandover = FALSE
    MarkerFirst = TRUE
    SessionAware = TRUE
    HandedAware = FALSE
PROPERTY Refines
CHECK_DEADLOCK FALSE
