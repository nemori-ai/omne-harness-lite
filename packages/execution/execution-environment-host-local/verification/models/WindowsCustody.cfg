\* Chosen design: an anchor process inside the Job holds a handle to the Job,
\* and handover keeps KILL_ON_JOB_CLOSE set. "Not found" counts as stop
\* evidence only in the creating session and boot.
SPECIFICATION Spec
CONSTANTS
    Units = {u1, u2}
    Cap = 1
    MaxRest = 1
    MaxCrash = 1
    Sessions = {s1, s2}
    MaxBridgeDeath = 1
    Anchor = TRUE
    ClearOnHandover = FALSE
    MarkerFirst = TRUE
    SessionAware = TRUE
    HandedAware = FALSE
INVARIANTS
    TypeOK Auxiliary
    NoLeak UniqueOwner OneDisposition StopTruth NoEntryAfterClose
    ClosureTruth NoEviction SettleTruth KeepWhenPermitted ReservedFromAcq
    UserCodeAfterPermit Reachable MarkerCoversJob NoRetainedKillOnClose
PROPERTIES
    Refines OwnerOnlyForward RetainedSurvivesRelease
CHECK_DEADLOCK FALSE
