\* N-W3: no anchor, and handover clears KILL_ON_JOB_CLOSE. Expected: StopTruth
\* is violated. The name of the Job goes away with its last handle while the
\* members still run, so "not found" is taken as stopped.
SPECIFICATION Spec
CONSTANTS
    Units = {u1, u2}
    Cap = 1
    MaxRest = 1
    MaxCrash = 1
    Sessions = {s1, s2}
    MaxBridgeDeath = 1
    Anchor = FALSE
    ClearOnHandover = TRUE
    MarkerFirst = TRUE
    SessionAware = TRUE
    HandedAware = FALSE
INVARIANT StopTruth
CHECK_DEADLOCK FALSE
