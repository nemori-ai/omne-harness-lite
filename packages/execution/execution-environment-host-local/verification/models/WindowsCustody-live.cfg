\* Liveness of the target design under weak fairness of the provider steps.
\* No crash and no reboot; one bridge death is allowed.
SPECIFICATION LiveSpec
CONSTANTS
    Units = {u1, u2}
    Cap = 1
    MaxRest = 1
    MaxCrash = 0
    Sessions = {s1}
    MaxBridgeDeath = 1
    Anchor = TRUE
    ClearOnHandover = FALSE
    MarkerFirst = TRUE
    SessionAware = TRUE
    HandedAware = FALSE
PROPERTIES
    ClosureEnds ReleaseEnds RetainedSettles
CHECK_DEADLOCK FALSE
