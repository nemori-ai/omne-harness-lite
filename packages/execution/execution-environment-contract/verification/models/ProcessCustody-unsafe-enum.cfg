\* N4, recovery accepts a partial enumeration as complete.
\* Expected: ClosureTruth or SettleTruth (T8) is violated.
SPECIFICATION Spec
CONSTANTS
    Units = {u1, u2}
    Cap = 1
    MaxRest = 1
    MaxCrash = 1
    Bound = TRUE
    Containment = "sealed"
    Policy = "retain"
    RecheckClosed = TRUE
    RecheckPhase = TRUE
    EvictOldest = FALSE
    HonestEnum = FALSE
INVARIANTS ClosureTruth SettleTruth
CHECK_DEADLOCK FALSE
