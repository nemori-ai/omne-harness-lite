\* Expected: KeepWhenPermitted (T10) is violated.
SPECIFICATION Spec
CONSTANTS
    Units = {u1, u2}
    Cap = 1
    MaxRest = 1
    MaxCrash = 1
    Bound = TRUE
    Containment = "sealed"
    Policy = "hangup"
    RecheckClosed = TRUE
    RecheckPhase = TRUE
    EvictOldest = FALSE
    HonestEnum = TRUE
INVARIANT KeepWhenPermitted
CHECK_DEADLOCK FALSE
