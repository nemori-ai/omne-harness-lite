\* One-step inductiveness of IndInv: start from every state that satisfies it.
\* One domain only, so that TLC can enumerate the initial states.
INIT IndInit
NEXT Next
CONSTANTS
    Units = {u1}
    Cap = 1
    MaxRest = 1
    MaxCrash = 1
    Bound = TRUE
    Containment = "sealed"
    Policy = "retain"
    RecheckClosed = TRUE
    RecheckPhase = TRUE
    EvictOldest = FALSE
    HonestEnum = TRUE
INVARIANT IndInv
CHECK_DEADLOCK FALSE
