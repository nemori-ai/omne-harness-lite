\* composition.account-registration v1 · progress
\* 唯一检查时序性质的配置。它用 Spec（带公平性），并把进展性质的两条前提
\* 写成常量取值：Failures = FALSE 是「存储最终持续可用」，
\* Abandoning = FALSE 是「发起者不放弃」。
\*
\* 为什么故障必须关掉：故障会把尝试收束到 interrupted，而 interrupted 也是
\* 一个终结结果——开着故障，EventualOutcome 会被「被打断」这条路径满足，
\* 检查的就不再是「动作链会走完」。

SPECIFICATION Spec

\* Expiring 也必须关掉，理由与故障同形：到期会把一次尝试推进不下去
\* （Organize 的 ~expired 前置），EventualOutcome 检查的就不再是「动作链会走完」。
\* S-19 的进展性质本来就不把清除链算作前提。

CONSTANTS
    Attempts = {a1, a2}
    None = None
    Failures = FALSE
    Abandoning = FALSE
    Expiring = FALSE

INVARIANTS
    TypeOK

PROPERTIES
    EventualOutcome
