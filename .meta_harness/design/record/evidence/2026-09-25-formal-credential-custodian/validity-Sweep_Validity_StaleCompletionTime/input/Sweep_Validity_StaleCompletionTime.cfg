\* Sweep_Validity_StaleCompletionTime -- negative configuration (NOT a formal task).
\* CompleteFreshTime = FALSE: the bridge judges expiry with the time of its
\* earlier read instead of the time read after being ordered on the binding.
\* Expected: GrantedResolvable violated -- the sweep discards an expired entry,
\* then the completion, using the stale time, still grants it.
SPECIFICATION Spec
CONSTANTS
    Bindings = {b1, b2}
    Refs = {r1, r2, r3}
    NoRef = NoRef
    NoBinding = NoBinding
    TTL = 1
    MaxTime = 3
    SweepOnlyThree = TRUE
    CompleteFreshTime = FALSE
    SweepEnabled = TRUE
INVARIANTS
    GrantedResolvable
CHECK_DEADLOCK FALSE
