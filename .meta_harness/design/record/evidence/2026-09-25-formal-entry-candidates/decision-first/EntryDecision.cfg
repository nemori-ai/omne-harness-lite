\* composition.governance-center-entry v2 · 判定次序（登记为 formal task 的唯一配置）
\*
\* 检查什么：S-8/S-10 ① 版本先于一切、S-10 ①′ 信封先于 ② 认人、S-18 公开体检不受挡、
\* S-19 免认人路由不看出示物、S-10/S-11「判不了优先于无效」、S-6/S-11「无效」只来自判定、
\* S-11 六种不认情形同一答复、S-33 认人之后才读到撤销仍同一答复、
\* S-10「先认人后看输入」「载荷先于身份推导与补授权」「免认人路由不用查就判输入」、
\* S-10/S-13 领域调用前的各关、S-7/S-12/S-13/S-14 缺陷一律 unavailable；
\* 以及 S-10 的进展（每个请求终会得到答复）。
\* AnsweredClosed 由 TypeOK 推出，列在这里只作回归，不绑定任何条款。
\*
\* 前提：Mutation = "none"（不改坏任何次序或映射）；一次行为只有一个请求；
\* 每次现读读得到与读不到由环境任选（无公平性约束环境）；
\* 流水线动作带弱公平（WF_vars(Pipeline)），Invalidate 不带——撤销是否发生由环境定。
\* 请求走到 done 之后没有后继动作，所以关掉死锁检查。

CONSTANTS
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AnsweredClosed
    VersionFirst
    EnvelopeBeforeAuth
    HealthUnconditional
    ExemptIgnoresPresentation
    CannotJudgeIsUnavailable
    RejectionOnlyWhenJudged
    RejectionUniform
    LateInvalidationUniform
    InputAfterAuth
    PayloadBeforeDerive
    ExemptInputWithoutLookup
    NoDomainWithoutGates
    DefectIsUnavailable

PROPERTIES
    EventuallyClassified

CHECK_DEADLOCK FALSE
