\* Transfer.tla 的复制一组的主检查配置：七处保护都在位，Scene = "copy"（组织型复制通知 c1、c2 与本人型复制 k1、k2）。
\*
\* 预期结果：在本配置的范围内，下列不变量与动作性质都不出现反例。
\* 规模：MaxClock = 3（隶属建立与重新加入合计至多三次）。
\*
\* CHECK_DEADLOCK 关掉，是因为本模型不承诺任何进展性质——
\* 「没有下一个动作可做」在这里不是缺陷；进展（不迟于 expiresAt 进入不可确认）
\* 不靠定时器，证据形式是规范场景 S-39。

CONSTANTS
    SameCommit = TRUE
    ConfirmRecheck = TRUE
    UseTimeCheck = TRUE
    SinceCheck = TRUE
    LayerCheck = TRUE
    ConfirmerCheck = TRUE
    SourceEndCheck = TRUE
    MaxClock = 3
    Scene = "copy"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLateOrDoubleSettle
    CopyLandsInsideBoundary
    NoForeignTenantLanding
    OrgLevelLandingByTargetAdmin
    AtMostOneLineageTarget
    EffectsOnlyFromConfirmation

PROPERTIES
    SettledStable

CHECK_DEADLOCK FALSE
