\* SessionLog_VolatileDedupe -- validity check, EXPECTED to fail
\* Dedupe reads an in-process set: after a provider crash the retry of an
\* already-written entry is judged new and written a second time.
SPECIFICATION Spec
CONSTANTS
  NumAttempts = 2
  NumKeys = 1
  NumProcs = 2
  MaxLen = 3
  MaxCrashes = 1
  Serialized = TRUE
  DurableDedupe = FALSE
INVARIANTS
  UniqueDedupeKey
