# 嵌套 describe 按 cases.tsv 用「 > 」连接；整个 describe 都承担时只写到 describe。
# 不绑（证据登记在 verification.md）：
#   - R-U1～R-U8（PF-017 §6.9、§6.10 的承接）、D-026 的 pg 接线、kernel-basis 的 no-testing-import、CV 换代演练——不是契约坐标；
