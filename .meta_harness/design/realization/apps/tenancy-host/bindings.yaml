# 绑定仍为 0，因为无已存在的证据可绑（入口契约仍是 candidate、源码未建）——没有一条已存在、会失败且登记过 run 的证据可指：
#   - 真实外键存在性、迁移合成、升级整体性、缺密钥与错配启动失败、撤除次序等测试尚未写（verification.md 逐条「未开始」）；
#   - tools/ts-checks 的 restricted-call-sites 规则已存在并自带自测，但它的运行尚未登记为 record/evidence run；
#   - registry 登记的 formal task（含 governance-center-entry-v1-decision）检查的是契约模型，没有一条在本节点的装配语义消失时会失败；
#   - kernel-basis 的 probe 证的是 4.0.4 内核语义，不是本节点的任何条款——它们作为机制依据记在 design.md，不绑。
