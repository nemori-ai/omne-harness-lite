  - clause: "capability.stream-assembly/v3#S-27"
    evidence: "formal:stream-assembly-v3-assembly"
    assumptions:
      - "只核P-7两半SplitInvariance与OneShotAccepted；后者只到模型Valid所表达语法，不等于完整表示接收"
      - "Indices={0,1}、Frags={a,b}、MaxEvents=6；abandon补finish不计入上限；无公平性假设、关闭死锁检查"
      - "实际正配置退出0并探索完毕；ReplaceAsAppend/OneShotCloseFirst分别exit12，命中SplitInvariance/OneShotAccepted与规定有效性轨迹"
      - "前提σ没有在开工具调用时接受改变内容的砍被构造吸收；模型无参数解析、载荷形状、replace_payload_shape、工具error等完整表示判定"
      - "run record/evidence/2026-09-26-formal-core-v3；当前冻结输入SHA对应；结果相等范围排除位置/firstContentAt/砍的汇总/emitted"
      - "这是给定有限模型证据；真实实现符合性及所有宿主/跨进程义务仍需独立产品与组合运行"
