version: 1
node: "stream-assembly"
kind: "provider"

bindings:
  - clause: "capability.stream-assembly/v2#S-6"
    evidence: "formal:stream-assembly-v2-assembly"
    assumptions:
      - "只证 P-1「块在状态里的次序是开块次序，与封口次序无关」（不变量 BlockOrderIsOpenOrder）；S-6 表里各项（归约、封口块、调用块怎样定下）不在此"
      - "常量 Indices = {0, 1}、Frags = {\"a\", \"b\"}、MaxEvents = 6：两块、两种片段、至多六个事件之内无反例；更大规模未穷举"
      - "一个模型实例是一条流、一个串行调用方；路由、分叉、乱序、重复与宿主重建不在模型里（宿主前提 S-28、部署表 S-29）"
      - "无公平性假设，只查安全性质；死锁检查关闭（本能力不承诺进展）"
      - "证据有效的前提是 Assembly_OrderByClose.cfg 在同一模型与相同规模下给出 BlockOrderIsOpenOrder 的反例；该负控只检查变异模型，不扩大主配置的常量与规模范围。"
      - "证的是模型 Assembly.tla，不是实现；实现是否等于模型须由一致性用例（契约 V-2）核，尚无"
      - "仅按对应 formal task 的模型、配置及本表列出的前提检查；不证明实现符合性或超出有限范围的性质。"

  - clause: "capability.stream-assembly/v2#S-27"
    evidence: "formal:stream-assembly-v2-assembly"
    assumptions:
      - "只证 P-7 的两半：结果相等 SplitInvariance（blocks、ending.reason、account 相等）与一次性形式也被逐个接受 OneShotAccepted；位置、firstContentAt、砍的汇总与 emitted 按契约本来就不在相等里"
      - "OneShotAccepted 只到模型的 Valid 为止（收尾、账、索引、块开没开、填法）；块头模态、载荷形状、replace_payload_shape、工具侧带 error 的收尾等表示层判定不在模型里"
      - "模型里没有参数解析、没有「被砍过的调用落成半截」规则、trim 不改任何东西：前提「σ 里没有在工具调用块开着时被接受的改变内容的砍」由模型的构造满足，S-12 那一支不被本证据覆盖"
      - "载荷抽象成符号序列；块标识、标注、块头不在模型里；「封口块等于归约」作为生产者前提写进模型"
      - "常量 Indices = {0, 1}、Frags = {\"a\", \"b\"}、MaxEvents = 6（Abandon 补的收尾不占上限）；无公平性假设"
      - "证据有效的前提是 Assembly_ReplaceAsAppend.cfg、Assembly_OneShotCloseFirst.cfg 在同一模型与相同规模下分别给出 SplitInvariance、OneShotAccepted 的反例。"
      - "证的是模型，不是实现；实现侧的证据是性质测试 V-3（随机切分与合并），尚无"
      - "仅按对应 formal task 的模型、配置及本表列出的前提检查；不证明实现符合性或超出有限范围的性质。"

  - clause: "capability.stream-assembly/v3#S-6"
    evidence: "formal:stream-assembly-v3-assembly"
    assumptions:
      - "只核P-1 BlockOrderIsOpenOrder（formal入口另列S-9落块对应），不覆盖S-6全部归约/封口/调用行为"
      - "Indices={0,1}、Frags={a,b}、MaxEvents=6；abandon补finish不计入上限；无公平性假设、关闭死锁检查"
      - "应在上述有限配置下完成正配置检查；执行环境、状态数、耗时及退出结果留本工作树 tmp/。"
      - "OrderByClose 变异必须在同输入下破坏 BlockOrderIsOpenOrder；有效性轨迹与执行结果留本工作树 tmp/。"
      - "仅按对应 formal task 的模型、配置及本表列出的前提检查；不证明实现符合性或超出有限范围的性质。"
      - "只证明给定有限模型检查范围；参数/载荷/砍过的调用/快照/首内容/汇总/完整表示与失败次序/真实代码及宿主前提不在模型"

  - clause: "capability.stream-assembly/v3#S-27"
    evidence: "formal:stream-assembly-v3-assembly"
    assumptions:
      - "只核P-7两半SplitInvariance与OneShotAccepted；后者只到模型Valid所表达语法，不等于完整表示接收"
      - "Indices={0,1}、Frags={a,b}、MaxEvents=6；abandon补finish不计入上限；无公平性假设、关闭死锁检查"
      - "正配置须完成有限检查；ReplaceAsAppend/OneShotCloseFirst 变异须分别反驳 SplitInvariance/OneShotAccepted，并符合规定的有效性轨迹。"
      - "前提σ没有在开工具调用时接受改变内容的砍被构造吸收；模型无参数解析、载荷形状、replace_payload_shape、工具error等完整表示判定"
      - "仅按对应 formal task 的模型、配置及本表列出的前提检查；不证明实现符合性或超出有限范围的性质；结果相等范围排除位置/firstContentAt/砍的汇总/emitted。"
      - "这是给定有限模型证据；真实实现符合性及所有宿主/跨进程义务仍需独立产品与组合运行"



  - clause: "capability.stream-assembly/v3#S-10"
    evidence: "test:tools/core-verification/src/w6-stream-consumer.ts#w6.stream.duplicate-parameters-versus-outer-text"
    assumptions:
      - "只核start／accept／snapshot／closeOut组成的重复参数键封口unparseable与raw原文保持；parsed和abandon不由这条用例证明，不扩展既有有限模型证明。"
      - "本条仅绑定上述具名用例的有限输入；执行输入、输出及接受过程归本工作树 tmp/。"
      - "有限实现测试，不是任意输入证明；测试通过不提升整体接受状态。"

  - clause: "capability.stream-assembly/v3#S-25"
    evidence: "test:tools/core-verification/src/w6-stream-consumer.ts#w6.stream.refusal-priority-and-historical-state"
    assumptions:
      - "表示判定在先、序列拒绝及旧状态不变的列举场景；全部八个序列失败还由同链其它具体场景与479本包测试承担。"
      - "本条仅绑定上述具名用例的有限输入；执行输入、输出及接受过程归本工作树 tmp/。"
      - "有限实现测试，不是任意输入证明；测试通过不提升整体接受状态。"
