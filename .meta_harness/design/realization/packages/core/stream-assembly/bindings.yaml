      - "常量 Indices = {0, 1}、Frags = {\"a\", \"b\"}、MaxEvents = 6（Abandon 补的收尾不占上限）；无公平性假设"
      - "证据有效的前提是变异配置 Assembly_ReplaceAsAppend.cfg、Assembly_OneShotCloseFirst.cfg 给得出反例：run record/evidence/2026-09-25-validity-stream-assembly（HUB 0ea85c0b）目录 Assembly_ReplaceAsAppend/ 与 Assembly_OneShotCloseFirst/ 各退出 12，SplitInvariance、OneShotAccepted 分别被违反，输入与本 run 相同（D-060 §八 M54）"
      - "证的是模型，不是实现；实现侧的证据是性质测试 V-3（随机切分与合并），尚无"
      - "run：record/evidence/2026-09-25-formal-assets-runtimes（HUB 1667ea4c），任务 stream-assembly-v2-assembly 退出 0"
