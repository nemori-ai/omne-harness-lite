      - "src[a] 离开 held 之后不回来：即假设 AT G-3（持有实例身份）已兑现；本节点靠 since 严格递增兑现它，依赖 N-1（infra/clock 交接）"
      - "失败值字面（offerNoLongerValid 三路同值）不在模型里，证据形式是场景 AT S-39"
