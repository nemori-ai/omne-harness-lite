      - "对 v2：capability.account-identity/v2#S-14 与本条逐字相同，模型检查的守卫与转移对它同样成立；前提是 v2 接受时该条仍逐字相同、组合改钉 v2 时模型的抽象动作不变。那之前只登 v1 坐标"
