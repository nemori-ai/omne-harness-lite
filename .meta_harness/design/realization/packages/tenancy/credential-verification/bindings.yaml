# 条款到证据的绑定表。
# 本节点兑现的是 capability.account-identity 里凭据形式那一半（S-8 派生与比对、S-26 判定）；那份契约不建形式工件。
# 下面的 test: 绑定全部来自 record/evidence/2026-09-23-tests-tenancy-leg-2（源码提交 c9b5850；逐条状态 cases.tsv，
# 义务对应 coverage.md）。证据 id 形式：test:<仓库相对测试文件路径>#<describe> › <it>。
# 版本：节点正文引的是 v1 坐标；S-8、S-26 在 v2 里原样（v2 §十「其余条款」），本节点的实现不分 v1／v2，
# 这些证据对 v2 同号条款同样成立——但按契约 verification 的继承规则，另一版要算它须由消费者逐条写明。
# 不绑：换代演练（证的是装配的重启半径论证，不是契约条款；登记在 verification.md）。
version: 1
node: "credential-verification"
kind: "provider"

bindings:
  - clause: "capability.account-identity/v1#S-8"
    evidence: "test:packages/tenancy/credential-verification/tests/obligations.spec.ts#credential-verification · 证据义务 › S-8 第 1 条：derive 的输出不含输入明文的任何子串，且同一输入两次派生不相等（盐）"
    assumptions:
      - "只证 S-8 第 1 条「不以可读形式保存」在本实现上成立：派生输出里找不到输入明文的任何子串、两次派生盐不同；「可读形式」的其他编码不在断言里"
      - "派生参数用测试参数（scrypt N=1024、r=8、p=1），不说明生产参数下的代价；强度与保存方式不在契约承诺里"
      - "Node v24.18.0 的 node:crypto（OpenSSL 3.5.7），单进程；run 2026-09-23-tests-tenancy-leg-2"
    alignment_checked: 2026-09-23

  - clause: "capability.account-identity/v1#S-8"
    evidence: "test:packages/tenancy/credential-verification/tests/obligations.spec.ts#credential-verification · 证据义务 › verify 三值：正确 ⇒ match；错误 ⇒ mismatch；scheme 不认识 ⇒ mismatch；参数损坏 ⇒ unavailable"
    assumptions:
      - "S-8「比对方式属实现选择」在本实现上的形状：参数损坏得 unavailable 而不是 mismatch；类型层另由 types.spec-d.ts › verify 恰三值 承担（同 run 通过）"
      - "单进程；时序侧信道不在任何义务里（契约明列不承诺）"
    alignment_checked: 2026-09-23

  - clause: "capability.account-identity/v1#S-8"
    evidence: "test:tools/ts-checks/tests/consumer-rules.spec.ts#sc-cv-1"
    assumptions:
      - "SC-CV-1（CV 包之外不对材料值做成员访问、正则解析、JSON.parse）规则的自测 3 条，含对真实 AI 源码的变异核对；守的是「材料不透明、account-identity 只存不读」"
      - "真实源码上的扫描是同 run 的 pnpm run lint:rules（退出 0，扫 packages/ 与 apps/）；文本规则漏掉经辅助函数的间接访问"
    alignment_checked: 2026-09-23

  - clause: "capability.account-identity/v1#S-26"
    evidence: "test:packages/tenancy/credential-verification/tests/obligations.spec.ts#credential-verification · 证据义务 › S-26：政策不合形状 ⇒ unavailable；不满足规则 ⇒ rejected 携理由；满足 ⇒ ok"
    assumptions:
      - "只证本节点的政策判定；「政策来源取不到不退化为不校验」那一半（S-13 以 credential-rejected 失败）归 account-identity 的注入演练"
      - "单进程，Node v24.18.0；run 2026-09-23-tests-tenancy-leg-2"
    alignment_checked: 2026-09-23
