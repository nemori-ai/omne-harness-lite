\* Transfer.tla 的分享一组的主检查配置：七处保护都在位，Scene = "share"（组织—组织分享邀请 s1、s2，组织内分享邀请 s3，本人型分享 o1；资产可被删除，w 可被提升到组织）。
\*
\* 预期结果：在本配置的范围内，下列不变量与动作性质都不出现反例。
\* 规模：MaxClock = 2（MaxClock = 3 约 730 万个状态，作为不登记的扩大范围运行另记）。
\*
\* CHECK_DEADLOCK 关掉，是因为本模型不承诺任何进展性质——
\* 「没有下一个动作可做」在这里不是缺陷；进展（不迟于 expiresAt 进入不可确认）
\* 不靠定时器，证据形式是规范场景 S-39。

CONSTANTS
    SameCommit = TRUE
    ConfirmRecheck = TRUE
    UseTimeCheck = TRUE
    SinceCheck = TRUE
    LayerCheck = TRUE
    ConfirmerCheck = TRUE
    SourceEndCheck = TRUE
    MaxClock = 2
    Scene = "share"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLateOrDoubleSettle
    UseInsideBoundary
    UseOnlyWhileMembersEffective
    NoRevivedUse
    NoForeignTenantLanding
    AtMostOneLiveSharingPerPair
    EffectsOnlyFromConfirmation
    SharingEndsWithSource
    NoUseAfterSourceGone

PROPERTIES
    SettledStable
    EndedStable

CHECK_DEADLOCK FALSE
