\* 进展性质。前提显式关闭：存储持续可用（Failures=FALSE）、发起者不放弃
\* （Abandoning=FALSE），分别对应契约 S-4 的前提 (e) 与 (d)。
\* 这两个前提不成立时本性质不作任何承诺——这正是有前提的进展性质的处理方式。
SPECIFICATION ProgressSpec
CONSTANTS
  Attempts = {a1, a2}
  None = NoValue
  Failures = FALSE
  Abandoning = FALSE
INVARIANTS
  TypeOK
  ActivatedHasTenant
  NoFalseSuccess
PROPERTIES
  EventualOutcome
CHECK_DEADLOCK FALSE
