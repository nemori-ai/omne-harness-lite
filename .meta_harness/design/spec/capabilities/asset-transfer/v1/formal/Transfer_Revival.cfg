\* Transfer.tla 的不复活的检查配置：六处保护都在位，Scene = "share"，检查时序性质 NoRevival——一段分享在让它成立的那层关系（隶属或任一端的成员关系）断开之后，永不再生效（PF-003 §6.12，U-3 已裁乙）。
\*
\* 预期结果：在本配置的范围内，下列时序性质都不出现反例。
\* 规模：MaxClock = 2——足够走出「解除 → 重新隶属」与「退出 → 重新加入」两条轨迹。
\*
\* CHECK_DEADLOCK 关掉，是因为本模型不承诺任何进展性质——
\* 「没有下一个动作可做」在这里不是缺陷；进展（不迟于 expiresAt 进入不可确认）
\* 不靠定时器，证据形式是规范场景 S-39。

CONSTANTS
    SameCommit = TRUE
    ConfirmRecheck = TRUE
    UseTimeCheck = TRUE
    SinceCheck = TRUE
    LayerCheck = TRUE
    ConfirmerCheck = TRUE
    MaxClock = 2
    Scene = "share"

SPECIFICATION Spec

PROPERTIES
    NoRevival

CHECK_DEADLOCK FALSE
