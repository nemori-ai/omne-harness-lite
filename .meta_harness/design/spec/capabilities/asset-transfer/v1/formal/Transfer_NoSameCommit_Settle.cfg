\* Transfer.tla 的**有效性核对**配置：把确认拆成「读—写」两步（去掉 S-18 的同提交）。预期轨迹：确认的第一步读到 pending，随后撤回写下 withdrawn（或时间走过 expiresAt），第二步照旧写下 accepted。
\*
\* 预期结果：TLC **找到** NoLateOrDoubleSettle 或 SettledStable 的反例（退出码非 0）。
\* 这个配置不是用来通过的，是用来失败的；它回答「那一处保护真的在保护什么吗」。
\* 找不到反例，说明对应条款在本模型里是平凡的——那时问题在模型或条款表述。
\* **它期望失败，因此不登记为 formal task**（与 formal-tasks.json 的语义相反）。

CONSTANTS
    SameCommit = FALSE
    ConfirmRecheck = TRUE
    UseTimeCheck = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLateOrDoubleSettle

PROPERTIES
    SettledStable

CHECK_DEADLOCK FALSE
