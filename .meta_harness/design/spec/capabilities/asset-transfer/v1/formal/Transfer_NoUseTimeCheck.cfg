\* Transfer.tla 的**有效性核对**配置：使用时不现读边界，只看一个由事件反应写下的「已记为解除」标记（S-31 禁止的做法）。预期轨迹：分享确认后解除隶属，事件反应没发生（或还没发生），使用照旧成立。
\*
\* 预期结果：TLC **找到** UseInsideBoundary 的反例（退出码非 0）。
\* 这个配置不是用来通过的，是用来失败的；它回答「那一处保护真的在保护什么吗」。
\* 找不到反例，说明对应条款在本模型里是平凡的——那时问题在模型或条款表述。
\* **它期望失败，因此不登记为 formal task**（与 formal-tasks.json 的语义相反）。

