\* Transfer.tla 的主检查配置：三处保护都在位（S-17、S-18、S-31）。
\* 预期结果：在本配置的范围内，下列不变量与动作性质都不出现反例。
\*
\* CHECK_DEADLOCK 关掉，是因为本模型不承诺任何进展性质——
\* 「没有下一个动作可做」在这里不是缺陷，本次要检查的只有安全性质。
\* 进展（不迟于 expiresAt 进入不可确认）不靠定时器，证据形式是规范场景 S-39。

CONSTANTS
    SameCommit = TRUE
    ConfirmRecheck = TRUE
    UseTimeCheck = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    NoLateOrDoubleSettle
    CopyLandsInsideBoundary
    UseInsideBoundary
    AtMostOneLineageTarget
    AtMostOneActiveSharingPerPair
    EffectsOnlyFromConfirmation

PROPERTIES
    SettledStable
    EndedStable

CHECK_DEADLOCK FALSE
