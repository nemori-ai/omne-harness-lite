\* Transfer.tla 的**有效性核对**配置：删除与提升的那一次提交里不结束分享（去掉 S-52 的写入）。预期轨迹：一份分享成立之后，分享方把那份资产提升到组织（或删除它），那份分享仍为 active、照旧被使用。
