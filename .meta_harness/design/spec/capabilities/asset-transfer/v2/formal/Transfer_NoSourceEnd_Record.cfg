\* Transfer.tla 的**有效性核对**配置：同上一份，检查记录上的形式。预期轨迹：一份分享成立之后，那份资产被删除（或被提升到组织），分享记录仍停在 active。
\*
\* 预期结果：TLC **找到** SharingEndsWithSource 的反例（退出码非 0）。
\* 这个配置不是用来通过的，是用来失败的；它回答「那一处保护真的在保护什么吗」。
\* 找不到反例，说明对应条款在本模型里是平凡的——那时问题在模型或条款表述。
\* **它期望失败，因此不登记为 formal task**（与 formal-tasks.json 的语义相反）。

