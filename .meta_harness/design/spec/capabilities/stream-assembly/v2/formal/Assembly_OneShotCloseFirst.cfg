\* 有效性核对（预期出反例，不登记为 formal task）：一次性形式把一块的封口排到它的填之前。
\* 预期 OneShotAccepted 被违反——证明「一次性形式本身逐个被接受」这条断言在构造次序写错时会失败；
\* SplitInvariance 在这个变异下仍成立（折叠不看守卫），所以它盖不住这一半。

CONSTANTS
    Indices = {0, 1}
    Frags = {"a", "b"}
    MaxEvents = 6
    Mutation = "oneshot_close_first"

INIT Init
NEXT Next

INVARIANTS
    OneShotAccepted

CHECK_DEADLOCK FALSE
