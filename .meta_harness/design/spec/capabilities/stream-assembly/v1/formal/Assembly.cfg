\* capability.stream-assembly v1 —— 登记为 formal task 的那一份配置。
\* 检查什么、前提是什么，见同目录 README.md「Assembly.cfg」一节。
\* 常量缩小：一个状态值、两个块索引、两个片段符号、至多六个事件；目标种类在 start 那一步里非确定地选。
\* 前六条按构造成立、不作证据（README「本版选用什么」）；作证据的是后三条，各配一个预期出反例的有效性核对配置。

CONSTANTS
    Indices = {0, 1}
    Frags = {"a", "b"}
    MaxEvents = 6
    Mutation = "none"

INIT Init
NEXT Next

INVARIANTS
    FinishIsLast
    AccountAtMostOnce
    ToolHasNoAccount
    OpenIndicesIncrease
    FillsLandOnOpenBlocks
    ResultOnlyWithFinish
    BlockOrderIsOpenOrder
    SplitInvariance
    OneShotAccepted

CHECK_DEADLOCK FALSE
