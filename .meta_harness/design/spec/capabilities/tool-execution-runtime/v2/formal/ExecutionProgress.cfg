\* 进展配置：六处保护全开，在公平性前提下检查三条进展性质；一次执行至多等一次（MaxWaits = 1），只为缩小状态空间——进展性质与等几次无关。
\* 前提：恢复扫描一旦能发生就终会发生（WF Recover）；交付物终会追加（WF Drain）；停下中的执行者终会实际停下（WF StopDone/LateReturn，
\* 即 execution_stop_grace 之后的强制停止确实生效）。预期结果：TLC 退出码 0，无反例。
\* 登记为 formal task tool-execution-runtime-v2-execution-progress。
CONSTANTS
    FirstWins = TRUE
    DurableHandoff = TRUE
    WriteBeforeStop = TRUE
    RecoverAll = TRUE
    NoRestart = TRUE
    CheckWaitIndex = TRUE
    MaxWaits = 1
SPECIFICATION FairSpec
PROPERTIES
    LostSettles
    HandoffLands
    StopsTakeEffect
CHECK_DEADLOCK FALSE
