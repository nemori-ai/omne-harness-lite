\* Sweep_Validity_SweepNotGranted -- negative configuration (NOT a formal task).
\* SweepOnlyThree = FALSE: the sweep discards every entry that is not the
\* granted one, including an entry whose binding is still pending and not
\* expired.  Expected: GrantedResolvable violated -- the entry is discarded,
\* then the bridge's completion grants the binding with it.
SPECIFICATION Spec
CONSTANTS
    Bindings = {b1, b2}
    Refs = {r1, r2, r3}
    NoRef = NoRef
    NoBinding = NoBinding
    TTL = 1
    MaxTime = 3
    SweepOnlyThree = FALSE
    CompleteFreshTime = TRUE
    SweepEnabled = TRUE
INVARIANTS
    GrantedResolvable
CHECK_DEADLOCK FALSE
