\* Sweep_Reach_Granted -- reachability probe (NOT a formal task).
\* Expected: NoGrantedEver violated.  The counterexample is the witness that a
\* binding can reach granted in the positive constants, so GrantedResolvable
\* is not vacuous.
SPECIFICATION Spec
CONSTANTS
    Bindings = {b1, b2}
    Refs = {r1, r2, r3}
    NoRef = NoRef
    NoBinding = NoBinding
    TTL = 1
    MaxTime = 3
    SweepOnlyThree = TRUE
    CompleteFreshTime = TRUE
    SweepEnabled = TRUE
INVARIANTS
    NoGrantedEver
CHECK_DEADLOCK FALSE
