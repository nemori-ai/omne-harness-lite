\* Finite runner configuration; see formal/README.md for assumptions.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NumPieces = 1
  NumWorkers = 2
  MaxAttempts = 1
  MaxCrashes = 1
  UsesFence = FALSE
  DurableDedupe = TRUE
  CommitFirst = TRUE
  RestoreFromDurable = TRUE
  DedupeReminders = TRUE
  DedupeCards = TRUE
  EnforceFence = TRUE
  RespectStop = TRUE
  RespectRetryGuard = TRUE
  ResumeAnswered = TRUE
INVARIANTS
  TypeOK
  OneFinalConclusionPerPiece
  CommitBeforeNext
  ReplayReproducesEffect
  RemindersExactlyOnce
  OneCardPerAsk
  StaleAttemptCannotWrite
  InputsFromDurablePrefix
  ControlStopsChain
  RetryPassedGuard
