\* Same-pass two-worker competition with the attempt fence enabled.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NumPieces = 1
  NumWorkers = 2
  MaxAttempts = 2
  MaxCrashes = 1
  UsesFence = TRUE
  DurableDedupe = TRUE
  CommitFirst = TRUE
  RestoreFromDurable = TRUE
  DedupeReminders = TRUE
  DedupeCards = TRUE
  EnforceFence = TRUE
  RespectStop = TRUE
  RespectRetryGuard = TRUE
  ResumeAnswered = TRUE
INVARIANTS
  TypeOK
  OneFinalConclusionPerPiece
  CommitBeforeNext
  ReplayReproducesEffect
  RemindersExactlyOnce
  OneCardPerAsk
  StaleAttemptCannotWrite
  InputsFromDurablePrefix
  ControlStopsChain
  RetryPassedGuard
