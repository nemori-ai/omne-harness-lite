\* 否定变体：跨域且 Session 的门不要求版本戳（FreshGate = FALSE）
\* 预期：ClassifyFresh（按陈旧视图对已终态的 Run 裁决出接续）或 L3（Resume 后按陈旧
\* 视图归档）反例，退出码 12 或 13
CONSTANTS
  Runs = {r1, r2}
  Instances = {a1}
  MaxQueue = 2
  MaxCont = 1
  MaxEpoch = 3
  MaxCrash = 1
  SameDomain = FALSE
  FreshGate = FALSE
SYMMETRY Symm
SPECIFICATION Spec
INVARIANTS TypeOK L3
PROPERTIES ClassifyFresh
