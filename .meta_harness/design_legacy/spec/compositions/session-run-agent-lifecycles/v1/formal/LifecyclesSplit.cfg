\* 跨域安全配置：Session 与 Run 不同协调域，门内读取带版本戳（FreshGate）
\* 预期：I1、S2、A1、L1、L3、NoDoubleCreate 与动作性质 ClassifyFresh 成立；
\* 状态形式的 I13/I14 在跨域不再是不变量（见 LifecyclesSplitProgress.cfg 的最终性质）
CONSTANTS
  Runs = {r1, r2}
  Instances = {a1}
  MaxQueue = 2
  MaxCont = 1
  MaxEpoch = 3
  MaxCrash = 1
  SameDomain = FALSE
  FreshGate = TRUE
SYMMETRY Symm
SPECIFICATION Spec
INVARIANTS TypeOK I1 S2 A1 L1 L3 A3 NoDoubleCreate
PROPERTIES ClassifyFresh
