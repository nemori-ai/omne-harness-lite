# 宿主无关的钩子声明；编译工具按宿主生成 .claude/settings.json 与 .codex/hooks.json。
# 一条钩子：在哪些事件（Stop、SubagentStop、SessionStart）、给哪些宿主、跑什么命令、宿主侧超时几秒。
# hosts 省略时给全部宿主。SessionStart 只为 Claude Code 生成，用它的钩子须写 hosts。
# subagent_types 只收窄 SubagentStop（Stop 在两端都不认 matcher），须是 roles/ 下已有的角色名。
# session_sources 只收窄 SessionStart，值是 Claude Code 输入里的 source（startup、resume、clear、compact、fork）。
hooks:
  - id: loop-stop-facts
    events: [Stop, SubagentStop]
    # 只对会改产品源码的角色。终端与验证设施实施都由 developer 承担。
    subagent_types: [developer]
    # shell 形式、从 git 根解析：两端都以会话的当前目录运行钩子，Codex 没有项目根变量。
    # 跑哪一份脚本：当前工作树里有这份脚本且装了依赖，就跑它自己的（它可能正在改这套工具）；
    # 否则跑主检出里的那一份——刚建的工作树还没装依赖，脚本加载不了解析器，量的仍是会话所在的那棵工作树。
    # 主检出取公共 git 目录的上一级；先进到工作树根再问，Git 2.25 在子目录里给的相对路径不可靠。
    # 不在 git 仓库里：退出 0，什么都不做。由 node 直接运行、不经包装命令：宿主把退出码 2 一律当成拦截，退出码只由脚本自己定。
    command: >-
      unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR
      GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_NAMESPACE GIT_SHALLOW_FILE;
      t="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0;
      s=tools/repo-toolchain;
      { [ -e "$t/$s/src/loop/stop-hook.ts" ] && [ -e "$t/$s/node_modules/typescript/package.json" ]; }
      || t="$(cd "$t" && cd "$(git rev-parse --git-common-dir)/.." && pwd)";
      exec node --experimental-strip-types "$t/$s/src/loop/stop-hook.ts"
    timeout: 60
  - id: stale-skill-copies
    events: [SessionStart]
    hosts: [claude-code]
    # 新会话与压缩之后：会话可能读到 .worktrees/ 下旧工作树里的技能副本，压缩后宿主还会重新附上已调用过的技能。
    session_sources: [startup, compact]
    # 脚本只读，打印一行提醒或什么都不打印；普通标准输出由 Claude Code 加进会话上下文。
    # 当前检出没有这份脚本（停在旧基线的工作树）就跑主检出里的那一份。
    # 钩子自己出错从不拦人：任何失败都不输出、退出 0。
    command: >-
      unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR
      GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_NAMESPACE GIT_SHALLOW_FILE;
      t="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0;
      s=.meta_harness/tooling/src/stale-skills.mjs;
      [ -e "$t/$s" ] || t="$(cd "$t" && cd "$(git rev-parse --git-common-dir)/.." && pwd)";
      node "$t/$s" 2>/dev/null; exit 0
    timeout: 10
