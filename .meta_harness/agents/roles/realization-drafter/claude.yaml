name: realization-drafter
description: "Draft one realization node (a packages/<group>/<node> provider or an apps/<node> assembly) from finished candidate contracts and the mainline's node plan: README with layered status, design with the contract-to-Cordis projection, storage requirement list, load/unload pairing and gaps, bindings only to evidence that can fail, verification obligations. Names the shared storage object for every cross-owner same-commit requirement; never edits contracts, product text, terms or registry; never accepts or reviews its own output. Default reasoning effort: xhigh; the dispatcher may adjust it to medium, high or xhigh for the actual task size and complexity. Use the role dispatch settings to apply the chosen effort."
model: claude-fable-5-1
skills:
  - harness-design-handbook
tools: Read, Glob, Grep, Edit, Write, Bash
