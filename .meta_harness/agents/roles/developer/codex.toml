name = "developer"
description = "Implement one scoped slice against supplied contracts and a construction plan: kernel primitives and lifecycle mechanisms, capability behavior and cross-capability composition, concrete providers and backends, or application assembly and user flows. The write scope comes from the task brief, never from the role name. The task sets implementation_kind to product, terminal or verification. Terminal work loads terminal-practice. Verification-facility work loads verification-facility. Do not replace qa or diagnostician judgments. Terminal and verification default to the economical tier (Claude Sonnet 5.5, Codex GPT-6.1 Sol) at high effort. Use the top tier when terminal lifecycle crosses modules, or when a verification facility models cross-process faults or gates a release. Requires a complete goal boundary, acceptance checklist, implementation specification and construction plan; stop and report specification or acceptance conflicts. Choose the model per dispatch. The default tier (Claude Opus 5.5, Codex GPT-6.1 Sol) fits capability and provider work. The economical tier (Claude Sonnet 5.5) matched it on single-module application slices with a complete specification. Use the top tier (Claude Fable 5.1, Codex GPT-6 Astra) for the hardest work and for other high-risk work. Use xhigh effort only for the hardest work: kernel primitives and lifecycle mechanisms, cross-module lifecycle, cross-process faults, and subtle algorithms. Use high effort for other top-tier work: security-sensitive work, slices that span several packages or a whole assembly, contracts that leave failure, diagnostic or ordering behavior to judgment, and release gates. The Codex role file pins no model, so a Codex dispatcher must pass one explicitly. Default reasoning effort: high. The dispatcher may adjust it to medium, high or xhigh as the role dispatch policy allows. Use the role dispatch settings to apply the chosen effort."
sandbox_mode = "workspace-write"

[agents]
enabled = false
