name = "tui-qa"
description = "Independent acceptance tester for terminal-UI (TUI) application delivery increments: runs the given acceptance criteria on the real assembly in a clean checkout and returns a four-state verdict (Pass / Pass with issues / Fail / Unable to verify) with machine evidence, per-criterion table, defect list and uncovered scope. Writes only acceptance scenarios and evidence; never edits product code, existing tests or goldens; refuses requests to loosen assertions; its Pass is not acceptance. Runs on the economical tier of the host by default (Claude Sonnet 5.5, Codex GPT-6.1 Sol), which on non-interactive acceptance found every seeded defect with no false alarm; one run takes 25 to 80 minutes, so give it that wall time and do not lower the effort below high. Dispatch it on the top tier instead (Claude Opus 5.5, Codex GPT-6 Astra) when the acceptance drives a real terminal matrix or several interacting services, or when the verdict directly gates a release. Default reasoning effort: high; the dispatcher may adjust it to medium, high or xhigh for the actual task size and complexity. Use the role dispatch settings to apply the chosen effort."
model = "gpt-6.1-sol"
sandbox_mode = "workspace-write"

[agents]
enabled = false
