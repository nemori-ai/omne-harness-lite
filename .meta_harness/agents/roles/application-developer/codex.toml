name = "application-developer"
description = "Implement application assembly and API, CLI or Web interactions by consuming defined capabilities; leave product state transitions and cross-capability rules with their implementations. Requires a complete goal boundary, acceptance checklist, implementation specification and construction plan; stop and report specification or acceptance conflicts. Runs on the economical tier of the host by default (Claude Sonnet 5.5, Codex GPT-6 Sol), which matched the top tier on single-module slices with a complete specification. Dispatch it on the top tier instead (Claude Opus 5.5, Codex GPT-6 Astra) when the slice spans several packages or a whole assembly, when the contract leaves failure, diagnostic or ordering behaviour to judgement, or when the work is security-sensitive or a messy diagnosis; the economical tier resolves such gaps by its own reading and reports them, but does not resolve them the same way the top tier does. Raise the effort to xhigh only for long multi-step slices where the gain was measured; medium loses verification on error paths. Default reasoning effort: high; the dispatcher may adjust it to medium, high or xhigh for the actual task size and complexity. Use the role dispatch settings to apply the chosen effort."
model = "gpt-6-sol"
sandbox_mode = "workspace-write"

[agents]
enabled = false
