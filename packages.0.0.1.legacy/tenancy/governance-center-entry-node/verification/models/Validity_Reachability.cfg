\* 有效性核对（否定配置，不登记为 formal task）：每一类答复与三处关键分支都可达。
\* 预期：用 -continue 运行时，下面九条「从不」谓词**全部**被违反。
\* 任何一条没有被违反，说明那一类答复或分支在本模型里根本到不了，
\* EntryDecision.cfg 下对应断言的「无反例」就可能是平凡的。
\*
\* 顺序是有意的：-continue 下 TLC 对每个违反状态只报它碰到的第一条。
\* NeverLateInvalidation 所在的状态同时也是一次「无效」答复、NeverDefect 所在的状态同时也是一次
\* unavailable 答复，排在 NeverRejected／NeverUnavailable 之后就会被遮住，所以放在最前。

CONSTANTS
    Mutation = "none"

SPECIFICATION Spec

INVARIANTS
    NeverLateInvalidation
    NeverDefect
    NeverGatePassed
    NeverHealth
    NeverResult
    NeverVersionMismatch
    NeverRejected
    NeverUnavailable
    NeverInvalidInput

CHECK_DEADLOCK FALSE
