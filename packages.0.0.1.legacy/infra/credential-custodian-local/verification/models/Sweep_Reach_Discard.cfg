\* Sweep_Reach_Discard -- reachability probe (NOT a formal task).
\* Expected: NoDiscardEver violated.  The counterexample is the witness that
\* the sweep does discard something in the positive constants, so
\* OrphanEventuallySwept is not satisfied by an antecedent that never holds.
SPECIFICATION Spec
CONSTANTS
    Bindings = {b1, b2}
    Refs = {r1, r2, r3}
    NoRef = NoRef
    NoBinding = NoBinding
    TTL = 1
    MaxTime = 3
    SweepOnlyThree = TRUE
    CompleteFreshTime = TRUE
    SweepEnabled = TRUE
INVARIANTS
    NoDiscardEver
CHECK_DEADLOCK FALSE
