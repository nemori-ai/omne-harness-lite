[project]
name = "omne-harness-lite"
version = "0.1.0"
description = "Development workspace for the omne-harness-lite monorepo"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["tools/spec-tools"]

[tool.uv.sources]
omne-harness-lite-spec-tools = { workspace = true }

[dependency-groups]
dev = ["omne-harness-lite-spec-tools", "pytest>=8,<9", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tools/spec-tools/tests", ".meta_harness/tooling/tests", ".meta_harness/agents/skills/design-subagents/canonical/scripts", ".meta_harness/agents/skills/delegate/canonical/scripts"]
