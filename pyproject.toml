[project]
name = "omne-harness-lite"
version = "0.1.0"
description = "Development workspace for the omne-harness-lite monorepo"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
# uv 不自己切换版本，范围外直接拒绝运行；经 mise 或 Homebrew 装的 uv 不能 self update，所以写范围不写精确版本。
required-version = ">=0.13.0,<0.14"

[tool.uv.workspace]
members = ["tools/spec-tools"]

[tool.uv.sources]
omne-harness-lite-spec-tools = { workspace = true }

[dependency-groups]
dev = ["omne-harness-lite-spec-tools", "pytest>=8,<9", "pytest-xdist>=3.6,<4", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tools/spec-tools/tests", ".meta_harness/tooling/tests"]
