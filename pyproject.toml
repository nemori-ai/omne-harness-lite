[project]
name = "omne-harness-lite-spec-tools"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "PyYAML>=6.0,<7",
  "markdown-it-py>=3,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["spec/tools/tests"]
pythonpath = ["spec/tools"]
