# 临时探测：验证交付身份 App（#546）的权限。只读，加一次写回同值的 Stage。验证后删除。
name: delivery-probe
on:
  push:
    branches: [github-gate]
    paths: [.github/workflows/delivery-probe.yml]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: delivery
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Probe
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT: PVT_kwDODPptlM4BmeFE
          FIELD: PVTSSF_lADODPptlM4BmeFEzhlG_3U
        run: |
          set -u
          echo "## 1. 安装令牌可访问的仓库"
          gh api installation/repositories --jq '[.repositories[].full_name]' || echo "FAILED"
          echo "## 2. publish 的 required reviewers"
          gh api "repos/$GITHUB_REPOSITORY/environments/publish" \
            --jq '[.protection_rules[] | select(.type=="required_reviewers") | .reviewers[] | {type, login: (.reviewer.login // .reviewer.slug)}]' || echo "FAILED"
          echo "## 3. #548 的 Project item 与 Stage"
          read -r ITEM OPTION NAME < <(gh api graphql -f query='query($o:String!,$r:String!){repository(owner:$o,name:$r){issue(number:548){projectItems(first:10){nodes{id project{id} fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name optionId}}}}}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" \
            --jq ".data.repository.issue.projectItems.nodes[] | select(.project.id==\"$PROJECT\") | [.id, .fieldValueByName.optionId, .fieldValueByName.name] | @tsv") || true
          echo "item=${ITEM:-<none>} option=${OPTION:-<none>} name=${NAME:-<none>}"
          [ -n "${ITEM:-}" ] && [ -n "${OPTION:-}" ] || { echo "FAILED: 没读到 membership 或 Stage"; exit 1; }
          echo "## 4. 写回同值并读回"
          gh api graphql -f query='mutation($p:ID!,$i:ID!,$f:ID!,$v:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$v}}){projectV2Item{fieldValueByName(name:"Status"){... on ProjectV2ItemFieldSingleSelectValue{name}}}}}' \
            -f p="$PROJECT" -f i="$ITEM" -f f="$FIELD" -f v="$OPTION" \
            --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.fieldValueByName.name' || echo "FAILED"
