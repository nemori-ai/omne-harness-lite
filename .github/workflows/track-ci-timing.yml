name: Temporary track CI timing
on:
  push:
    branches: [brian/tmp-track-ci-timing-20261022]
permissions:
  contents: read
jobs:
  timing:
    name: ${{ matrix.sample }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sample: latest-incremental
            head: c00643a46c4b2b63b4be50d37689ff4974132eeb
            base: 0add8d200508dab82be702342a888c9d406e3f6f
    env:
      OMNE_ADMISSION: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TURBO_NO_UPDATE_NOTIFIER: '1'
      OMNE_TEST_LEDGER_HOME: /tmp/omne-timing-ledger
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Record coordinates and host
        run: |
          echo "BASELINE=${{ matrix.base }}" >> "$GITHUB_ENV"
          git config user.name "Brian Lee"
          git config user.email "aiephoenixbl@gmail.com"
          git show -s --format=fuller HEAD
          node --version
          pnpm --version
          lscpu
          free -h
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm -r rebuild node-pty
          uv sync --locked
      - name: Prepare metadata required by offline consumer tests
        run: |
          mkdir -p "$RUNNER_TEMP/offline-seed"
          printf '%s\n' '{"private":true,"dependencies":{"jsonc-parser":"3.3.1","@deepseek-ai/cordis":"4.0.4"}}' > "$RUNNER_TEMP/offline-seed/package.json"
          pnpm --dir "$RUNNER_TEMP/offline-seed" install --ignore-scripts --no-frozen-lockfile
      - name: Generate local agent projections
        run: uv run --locked python .meta_harness/tooling/src/initialize_agents.py --project-root .
      - name: Compute existing incremental plan
        run: |
          mkdir -p tmp/ci-timing
          git status --porcelain > tmp/ci-timing/dirty-before-plan.txt
          node --experimental-strip-types tools/test-runner/src/testing/cli.ts plan --json tmp/ci-timing/plan.json | tee tmp/ci-timing/plan.txt
      - name: Build selected members
        id: build
        continue-on-error: true
        run: node --experimental-strip-types tools/test-runner/src/testing/cli.ts step build --plan tmp/ci-timing/plan.json
      - name: Typecheck selected members
        id: typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node --experimental-strip-types tools/test-runner/src/testing/cli.ts step typecheck --plan tmp/ci-timing/plan.json
      - name: Test selected members fast and slow
        id: test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node --experimental-strip-types tools/test-runner/src/testing/cli.ts step test --plan tmp/ci-timing/plan.json
      - name: Acceptance selected members
        id: acceptance
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: node --experimental-strip-types tools/test-runner/src/testing/cli.ts step acceptance --plan tmp/ci-timing/plan.json
      - name: Python tests when affected
        id: python
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node --experimental-strip-types tools/test-runner/src/testing/cli.ts step python --plan tmp/ci-timing/plan.json
      - name: Report measured failures
        if: ${{ !cancelled() }}
        run: |
          node -e 'const steps=JSON.parse(process.env.STEPS); const bad=Object.entries(steps).filter(([,v])=>v.outcome==="failure"); if(bad.length){console.error(bad);process.exit(1)}'
        env:
          STEPS: ${{ toJSON(steps) }}
      - name: Save evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.sample }}
          path: |
            tmp/ci-timing
            /tmp/omne-timing-ledger
          retention-days: 7
