name: gate-reconcile

# On main this only starts the definition on github-gate, which holds the
# real flow. Dispatch it with --ref github-gate to run the check directly.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gate-reconcile.yml --repo "$GITHUB_REPOSITORY" --ref github-gate
