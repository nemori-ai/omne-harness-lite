name: gate-reconcile

# Runs from github-gate. The file with the same name on main runs on a schedule
# and only dispatches this definition. It reports gaps and never creates tags.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-reconcile
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  reconcile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report trunk commits without a record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/github-gate ]] || { echo "rejected: run is not on github-gate"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/contents/gate/cutover.json?ref=$GITHUB_SHA" --jq .content | base64 -d > cutover.json
          git init -q work && cd work
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --filter=blob:none origin 'refs/heads/main:refs/remotes/origin/main' 'refs/heads/integration/*:refs/remotes/origin/integration/*' 'refs/tags/omne/gate/*:refs/tags/omne/gate/*'
          stable_listing=$(git ls-remote origin refs/heads/stable | awk '$2=="refs/heads/stable"{print $1}')
          if [ -n "$stable_listing" ]; then git fetch -q --filter=blob:none origin 'refs/heads/stable:refs/remotes/origin/stable'; fi
          gaps=0
          report() {
            local title=$1 body=$2
            local existing
            existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state all --search "\"$title\" in:title" --json number --jq '.[0].number // ""')
            if [ -n "$existing" ]; then
              echo "already reported: $title"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            fi
            gaps=$((gaps+1))
          }
          refs=$(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/main refs/remotes/origin/integration)
          for ref in $refs; do
            start=$(jq -r --arg b "$ref" '.[$b] // ""' ../cutover.json)
            if [ -z "$start" ] && [[ "$ref" == integration/* ]]; then
              start=$(git rev-parse -q --verify "refs/tags/omne/gate/track/${ref#integration/}^{commit}" || true)
            fi
            if ! [[ "$start" =~ ^[0-9a-f]{40}$ ]]; then
              report "Gate gap: $ref has no cutover point" "The branch \`$ref\` is not listed in \`gate/cutover.json\` on github-gate and has no \`omne/gate/track\` start tag. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              continue
            fi
            commits=$(git rev-list --first-parent "$start..refs/remotes/origin/$ref")
            for c in $commits; do
              if git rev-parse -q --verify "refs/tags/omne/gate/unit/$c" >/dev/null; then
                points=$(git rev-parse "refs/tags/omne/gate/unit/$c^{commit}")
                target=$(git cat-file -p "refs/tags/omne/gate/unit/$c" | sed '1,/^$/d' | jq -r .target)
                [ "$points" = "$c" ] && [ "$target" = "refs/heads/$ref" ] && continue
              fi
              report "Gate gap: $ref ${c:0:12}" "Commit \`$c\` on the first-parent history of \`$ref\` has no matching \`omne/gate/unit\` record. An admin closes this gap with a named decision in this Issue. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            done
          done
          # A track whose upstream chain has a deleted branch can only be deleted itself
          # (RFC-0011 sections 8 and 13). Start tags stay after a branch is deleted, so the
          # chain is still readable. A track without any identity is reported above.
          parent_of() {
            local name=$1
            if git rev-parse -q --verify "refs/tags/omne/gate/track/$name" >/dev/null; then
              git cat-file -p "refs/tags/omne/gate/track/$name" | sed '1,/^$/d' \
                | jq -er 'if type == "object" then (.parent // "main") else error("not a record") end'
            elif jq -e --arg b "integration/$name" 'has($b)' ../cutover.json >/dev/null; then
              echo main
            else
              return 1
            fi
          }
          for ref in $refs; do
            [[ "$ref" == integration/* ]] || continue
            cur=${ref#integration/} depth=0
            while p=$(parent_of "$cur") && [ "$p" != main ]; do
              if ! git rev-parse -q --verify "refs/remotes/origin/integration/$p" >/dev/null; then
                report "Gate gap: $ref upstream integration/$p is missing" "The upstream chain of \`$ref\` contains \`integration/$p\`, and that branch no longer exists. An upstream cannot change and a deleted name cannot be created again, so \`$ref\` and every track below the missing one can only be deleted, from the bottom up. This gap closes when they are all deleted. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                break
              fi
              depth=$((depth+1)); [ "$depth" -le 64 ] || { echo "stopped: the upstream chain of $ref is too long"; exit 1; }
              cur=$p
            done
          done
          if git rev-parse -q --verify refs/remotes/origin/stable >/dev/null; then
            s=$(git rev-parse refs/remotes/origin/stable)
            ok=no
            if git rev-parse -q --verify "refs/tags/omne/gate/stable/$s" >/dev/null; then
              points=$(git rev-parse "refs/tags/omne/gate/stable/$s^{commit}")
              target=$(git cat-file -p "refs/tags/omne/gate/stable/$s" | sed '1,/^$/d' | jq -r .target)
              [ "$points" = "$s" ] && [ "$target" = refs/heads/stable ] && ok=yes
            fi
            [ "$ok" = yes ] || report "Gate gap: stable ${s:0:12}" "The tip \`$s\` of \`stable\` has no matching \`omne/gate/stable/$s\` record."
          fi
          echo "gaps: $gaps"
