name: gate-release

# Empty shell. workflow_dispatch needs a file with this name on the default
# branch. Dispatch it with --ref github-gate; that branch holds the real flow.

on:
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: choice
        options:
          - repo-toolchain
          - repo-config
      commit:
        required: true
        type: string
      issue:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dispatch this workflow with --ref github-gate." && exit 1
