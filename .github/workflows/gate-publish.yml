name: gate-publish
run-name: "gate-publish #${{ inputs.pr }}"

# Runs only from the github-gate branch. The file with the same name on main
# is an empty shell that exists so that workflow_dispatch can find it.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      head:
        description: Expected PR head commit (40 hex characters)
        required: true
        type: string
      checkpoint:
        description: Checkpoint name, only for a PR into stable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gate-publish-pr-${{ inputs.pr }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_ref: ${{ steps.plan.outputs.base_ref }}
      base: ${{ steps.plan.outputs.base }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Plan the publication
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          H: ${{ inputs.head }}
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          [[ "$GITHUB_REF" == refs/heads/github-gate ]] || { echo "rejected: run is not on github-gate"; exit 1; }
          [[ "$PR" =~ ^[0-9]{1,6}$ ]] || { echo "rejected: pr"; exit 1; }
          [[ "$H" =~ ^[0-9a-f]{40}$ ]] || { echo "rejected: head"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > pr.json
          [ "$(jq -r .state pr.json)" = open ] || { echo "rejected: PR is not open"; exit 1; }
          [ "$(jq -r .head.repo.full_name pr.json)" = "$GITHUB_REPOSITORY" ] || { echo "rejected: PR from a fork"; exit 1; }
          [ "$(jq -r .head.sha pr.json)" = "$H" ] || { echo "rejected: PR head is not the expected commit"; exit 1; }
          base_ref=$(jq -r .base.ref pr.json)
          head_ref=$(jq -r .head.ref pr.json)
          case "$base_ref" in
            main)
              [[ "$head_ref" == integration/* ]] || { echo "rejected: main accepts PRs only from integration/*"; exit 1; }
              mode=merge ;;
            integration/*)
              case "$head_ref" in
                integration/*|stable|release|github-gate) echo "rejected: a track accepts PRs only from main or a personal branch"; exit 1 ;;
              esac
              mode=merge ;;
            stable)
              [ "$head_ref" = main ] || { echo "rejected: stable accepts PRs only from main"; exit 1; }
              [[ "$CHECKPOINT" =~ ^[a-z0-9][a-z0-9.-]{0,39}$ ]] || { echo "rejected: checkpoint name is required for stable"; exit 1; }
              mode=fast-forward ;;
            *) echo "rejected: base branch $base_ref is not a trunk"; exit 1 ;;
          esac
          base=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "refs/heads/$base_ref" | awk -v r="refs/heads/$base_ref" '$2==r{print $1}')
          base=${base:-none}
          {
            echo "### Publication awaiting confirmation"
            echo
            echo "- PR: #$PR ($head_ref into $base_ref)"
            echo "- Mode: $mode"
            echo "- Target now: \`$base\`"
            echo "- PR head: \`$H\`"
            [ "$mode" = fast-forward ] && echo "- Records: \`omne/gate/stable/<result>\` and \`omne/gate/checkpoint/$CHECKPOINT\`"
            echo
            echo "Tests are not run by this flow. The confirmation note must state which checks were run locally and their results."
          } >> "$GITHUB_STEP_SUMMARY"
          { echo "base_ref=$base_ref"; echo "base=$base"; echo "mode=$mode"; } >> "$GITHUB_OUTPUT"

  # Repository toolchain gate. A PR from a personal branch into a track changes the
  # repository; every other publication (track into main, main into a track or stable)
  # carries commits that already entered a track this way. The protected path list
  # lives on github-gate (gate/toolchain-paths.txt) and is read from this run's commit,
  # so a PR cannot edit it. Hits are the files the target will change after publication,
  # computed from the same merge-tree result that publish builds.
  scope:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      toolchain: ${{ steps.scope.outputs.toolchain }}
    steps:
      - name: Find protected toolchain paths that this publication changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          H: ${{ inputs.head }}
          BASE_REF: ${{ needs.plan.outputs.base_ref }}
          B: ${{ needs.plan.outputs.base }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          [[ "$H" =~ ^[0-9a-f]{40}$ ]] || { echo "rejected: head"; exit 1; }
          [[ "$B" =~ ^([0-9a-f]{40}|none)$ ]] || { echo "rejected: base"; exit 1; }
          head_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.ref)
          if [ "$MODE" != merge ] || [[ "$BASE_REF" != integration/* ]] || [ "$head_ref" = main ]; then
            echo "toolchain=false" >> "$GITHUB_OUTPUT"
            echo "Toolchain gate: not applicable ($head_ref into $BASE_REF)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/contents/gate/toolchain-paths.txt?ref=$GITHUB_SHA" --jq .content | base64 -d > paths.txt
          mapfile -t specs < <(sed -e 's/#.*//' -e 's/[[:space:]]*$//' -e '/^$/d' paths.txt)
          [ "${#specs[@]}" -gt 0 ] || { echo "stopped: the toolchain path list is empty"; exit 1; }
          git init -q work && cd work
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin "$H" "$B" || { echo "stopped: cannot fetch the PR head and target"; exit 1; }
          tree=$(git merge-tree --write-tree "$B" "$H") || { echo "stopped: merge conflict, resolve it on the source branch first"; exit 1; }
          pathspecs=(); for p in "${specs[@]}"; do pathspecs+=(":(glob)$p"); done
          git diff-tree -r --name-only "$B" "$tree" -- "${pathspecs[@]}" > ../hits.txt || { echo "stopped: cannot compare the result with the target"; exit 1; }
          cd ..
          if [ -s hits.txt ]; then
            echo "toolchain=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Repository toolchain paths changed"
              echo
              echo "This publication changes $(wc -l < hits.txt) protected path(s). A second confirmation in \`repo-toolchain-review\` is required, with a note that states why."
              echo
              sed 's/^/- `/; s/$/`/' hits.txt | head -200
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "toolchain=false" >> "$GITHUB_OUTPUT"
            echo "Toolchain gate: no protected path changes." >> "$GITHUB_STEP_SUMMARY"
          fi

  toolchain-review:
    needs: [plan, scope]
    if: needs.scope.outputs.toolchain == 'true'
    runs-on: ubuntu-latest
    environment: repo-toolchain-review
    permissions:
      contents: read
      actions: read
    outputs:
      approver: ${{ steps.confirm.outputs.approver }}
      note: ${{ steps.confirm.outputs.note }}
    steps:
      - name: Read the toolchain confirmation and require a note
        id: confirm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > approvals.json
          sel='[.[]|select(.state=="approved")|select([.environments[].name]|index("repo-toolchain-review"))]|last'
          approver=$(jq -r "$sel|.user.login // \"\"" approvals.json)
          note=$(jq -r "$sel|.comment // \"\"" approvals.json)
          [ -n "$approver" ] || { echo "rejected: no toolchain approval record"; exit 1; }
          [ -n "$(printf '%s' "$note" | tr -d '[:space:]')" ] || { echo "rejected: the toolchain confirmation note is empty"; exit 1; }
          echo "approver=$approver" >> "$GITHUB_OUTPUT"
          delim="NOTE_$(openssl rand -hex 16)"
          { echo "note<<$delim"; printf '%s\n' "$note"; echo "$delim"; } >> "$GITHUB_OUTPUT"

  publish:
    needs: [plan, scope, toolchain-review]
    # A skipped toolchain review would skip this job by default; run it only when the
    # review succeeded or was not required.
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.scope.result == 'success' &&
      (needs.toolchain-review.result == 'success' ||
       (needs.toolchain-review.result == 'skipped' && needs.scope.outputs.toolchain == 'false'))
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      actions: read
    steps:
      - name: Read the confirmation and require a note
        id: confirm
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > approvals.json
          sel='[.[]|select(.state=="approved")|select([.environments[].name]|index("publish"))]|last'
          approver=$(jq -r "$sel|.user.login // \"\"" approvals.json)
          note=$(jq -r "$sel|.comment // \"\"" approvals.json)
          [ -n "$approver" ] || { echo "rejected: no approval record"; exit 1; }
          [ -n "$(printf '%s' "$note" | tr -d '[:space:]')" ] || { echo "rejected: the confirmation note is empty"; exit 1; }
          echo "approver=$approver" >> "$GITHUB_OUTPUT"
          delim="NOTE_$(openssl rand -hex 16)"
          { echo "note<<$delim"; printf '%s\n' "$note"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Mint publish identity token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - name: Build and verify the result without executing repository content
        id: build
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PR: ${{ inputs.pr }}
          H: ${{ inputs.head }}
          CHECKPOINT: ${{ inputs.checkpoint }}
          BASE_REF: ${{ needs.plan.outputs.base_ref }}
          B: ${{ needs.plan.outputs.base }}
          MODE: ${{ needs.plan.outputs.mode }}
          APPROVER: ${{ steps.confirm.outputs.approver }}
        run: |
          [[ "$H" =~ ^[0-9a-f]{40}$ ]] || { echo "rejected: head"; exit 1; }
          [[ "$B" =~ ^([0-9a-f]{40}|none)$ ]] || { echo "rejected: base"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/contents/gate/cutover.json?ref=$GITHUB_SHA" --jq .content | base64 -d > cutover.json
          now_head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          [ "$now_head" = "$H" ] || { echo "stopped: the PR head changed after dispatch"; exit 1; }
          [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .base.ref)" = "$BASE_REF" ] || { echo "stopped: the PR base changed"; exit 1; }

          git init -q work && cd work
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin "$H" "refs/heads/main:refs/remotes/origin/main"
          git fetch -q origin 'refs/tags/omne/gate/*:refs/tags/omne/gate/*'
          now_base=$(git ls-remote origin "refs/heads/$BASE_REF" | awk -v r="refs/heads/$BASE_REF" '$2==r{print $1}'); now_base=${now_base:-none}
          [ "$now_base" = "$B" ] || { echo "stopped: $BASE_REF moved since dispatch"; exit 1; }
          [ "$B" = none ] || git fetch -q --no-tags origin "$B"

          # Every first-parent commit after the cutover point must carry a unit.
          covered() {
            local branch=$1 tip=$2 start c target
            start=$(jq -r --arg b "$branch" '.[$b] // ""' ../cutover.json)
            if [ -z "$start" ] && [[ "$branch" == integration/* ]]; then
              start=$(git rev-parse -q --verify "refs/tags/omne/gate/track/${branch#integration/}^{commit}" || true)
            fi
            [[ "$start" =~ ^[0-9a-f]{40}$ ]] || { echo "rejected: no cutover point or track start tag for $branch"; return 1; }
            git fetch -q --no-tags origin "$start" || { echo "stopped: cannot fetch the start of $branch"; return 1; }
            git merge-base --is-ancestor "$start" "$tip" || { echo "rejected: $tip does not contain the cutover point of $branch"; return 1; }
            commits=$(git rev-list --first-parent "$start..$tip") || { echo "stopped: cannot read the history of $branch"; return 1; }
            for c in $commits; do
              git rev-parse -q --verify "refs/tags/omne/gate/unit/$c" >/dev/null || { echo "stopped: $branch commit $c has no unit"; return 1; }
              target=$(git cat-file -p "refs/tags/omne/gate/unit/$c" | sed '1,/^$/d' | jq -r .target) || { echo "stopped: cannot read the unit of $c"; return 1; }
              [ "$(git rev-parse "refs/tags/omne/gate/unit/$c^{commit}")" = "$c" ] || { echo "stopped: unit of $c points elsewhere"; return 1; }
              [ "$target" = "refs/heads/$branch" ] || { echo "stopped: unit of $c records $target"; return 1; }
            done
          }

          approver_id=$(gh api "users/$APPROVER" --jq .id)
          approver_name=$(gh api "users/$APPROVER" --jq '.name // .login')
          bot_id=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
          export GIT_COMMITTER_NAME="${APP_SLUG}[bot]" GIT_COMMITTER_EMAIL="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          head_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.ref)
          case "$BASE_REF:$head_ref" in
            main:integration/*|stable:main) ;;
            integration/*:integration/*|integration/*:stable|integration/*:release|integration/*:github-gate) echo "rejected: head branch $head_ref cannot enter $BASE_REF"; exit 1 ;;
            integration/*:*) ;;
            *) echo "rejected: head branch $head_ref cannot enter $BASE_REF"; exit 1 ;;
          esac
          title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)

          extra=
          if [ "$MODE" = merge ]; then
            [ "$B" != none ] || { echo "rejected: target branch does not exist"; exit 1; }
            if [ "$BASE_REF" = main ]; then covered "$head_ref" "$H"; fi
            tree=$(git merge-tree --write-tree "$B" "$H") || { echo "stopped: merge conflict, resolve it on the source branch first"; exit 1; }
            msg=$(printf 'Merge pull request #%s from %s\n\n%s\n\nConfirmed-by: %s\nGate-Run: %s\n' "$PR" "$head_ref" "$title" "$APPROVER" "$run_url")
            C=$(GIT_AUTHOR_NAME="$approver_name" GIT_AUTHOR_EMAIL="${approver_id}+${APPROVER}@users.noreply.github.com" \
                git commit-tree "$tree" -p "$B" -p "$H" -m "$msg")
            [ "$(git rev-list --parents -n1 "$C")" = "$C $B $H" ] || { echo "rejected: parents"; exit 1; }
            tag="omne/gate/unit/$C"
          else
            git merge-base --is-ancestor "$H" origin/main || { echo "rejected: $H is not on main"; exit 1; }
            git rev-list --first-parent origin/main > ../main-fp.txt; grep -qx "$H" ../main-fp.txt || { echo "rejected: $H is not on the first-parent history of main"; exit 1; }
            covered main "$H"
            if [ "$B" != none ]; then git merge-base --is-ancestor "$B" "$H" || { echo "rejected: stable cannot fast-forward to $H"; exit 1; }; fi
            C=$H
            # The record is named by the commit, so one commit can enter stable only once.
            # If another publication already moved stable to C, this tag exists and the
            # atomic push fails, even though git push skips the lease for an unchanged ref.
            tag="omne/gate/stable/$C"
            extra="omne/gate/checkpoint/$CHECKPOINT"
          fi
          for t in "$tag" ${extra:+"$extra"}; do
            git rev-parse -q --verify "refs/tags/$t" >/dev/null && { echo "stopped: $t already exists"; exit 1; }
          done
          record=$(jq -cn --arg target "refs/heads/$BASE_REF" --arg base "$B" --arg head "$H" --arg result "$C" \
            --arg pr "$PR" --arg mode "$MODE" --arg approver "$APPROVER" --arg run "$run_url" --arg gate "$GITHUB_SHA" --arg checkpoint "${extra:-}" \
            '{schema:"omne-gate-record:v1",target:$target,base:$base,head:$head,result:$result,pr:($pr|tonumber),mode:$mode,confirmedBy:$approver,run:$run,gate:$gate}
             + (if $checkpoint == "" then {} else {checkpoint:$checkpoint} end)')
          git tag -a "$tag" -m "$record" "$C"
          [ -z "${extra:-}" ] || git tag -a "$extra" -m "$record" "$C"
          { echo "result=$C"; echo "tag=$tag"; echo "extra=${extra:-}"; } >> "$GITHUB_OUTPUT"
          echo "built $C, tag $tag"

      - name: Post the publication decision
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
          H: ${{ inputs.head }}
          BASE_REF: ${{ needs.plan.outputs.base_ref }}
          B: ${{ needs.plan.outputs.base }}
          C: ${{ steps.build.outputs.result }}
          TAG: ${{ steps.build.outputs.tag }}
          EXTRA: ${{ steps.build.outputs.extra }}
          APPROVER: ${{ steps.confirm.outputs.approver }}
          NOTE: ${{ steps.confirm.outputs.note }}
          TOOLCHAIN: ${{ needs.scope.outputs.toolchain }}
          TC_APPROVER: ${{ needs.toolchain-review.outputs.approver }}
          TC_NOTE: ${{ needs.toolchain-review.outputs.note }}
        run: |
          quoted=$(printf '%s\n' "$NOTE" | sed 's/^/> /')
          toolchain=
          if [ "$TOOLCHAIN" = true ]; then
            tc_quoted=$(printf '%s\n' "$TC_NOTE" | sed 's/^/> /')
            toolchain=$(printf '\nRepository toolchain confirmation by @%s (paths are listed in the run summary):\n\n%s\n' "$TC_APPROVER" "$tc_quoted")
          fi
          body=$(printf '**Publication decision**\n\n- Target: `%s`, now `%s`\n- PR head: `%s`\n- Result: `%s`\n- Record tag: `%s` %s\n- Confirmed by: @%s (from the platform approval record)\n- Run: %s/%s/actions/runs/%s\n\nConfirmation note:\n\n%s\n%s' \
            "$BASE_REF" "$B" "$H" "$C" "$TAG" "${EXTRA:+and \`$EXTRA\`}" "$APPROVER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$quoted" "$toolchain")
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" --jq .html_url

      - name: Update the target and create the record tag in one atomic push
        env:
          BASE_REF: ${{ needs.plan.outputs.base_ref }}
          B: ${{ needs.plan.outputs.base }}
          C: ${{ steps.build.outputs.result }}
          TAG: ${{ steps.build.outputs.tag }}
          EXTRA: ${{ steps.build.outputs.extra }}
        run: |
          cd work
          expect=$B; [ "$expect" = none ] && expect=
          refspecs=("$C:refs/heads/$BASE_REF" "refs/tags/$TAG:refs/tags/$TAG")
          [ -z "$EXTRA" ] || refspecs+=("refs/tags/$EXTRA:refs/tags/$EXTRA")
          git push --atomic --force-with-lease="refs/heads/$BASE_REF:$expect" origin "${refspecs[@]}"
          after=$(git ls-remote origin "refs/heads/$BASE_REF" | awk -v r="refs/heads/$BASE_REF" '$2==r{print $1}')
          [ "$after" = "$C" ] || { echo "push reported success but $BASE_REF is not $C"; exit 1; }
          echo "published $BASE_REF = $C"

      - name: Record the outcome
        if: always() && steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ inputs.pr }}
          OUTCOME: ${{ job.status }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="Publication outcome: $OUTCOME (run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" --jq .html_url
