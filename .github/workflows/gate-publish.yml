name: gate-publish
run-name: "gate-publish:${{ inputs.pr }}:${{ inputs.head }}:${{ inputs.checkpoint }}"

# Empty shell. workflow_dispatch needs a file with this name on the default
# branch. Dispatch it with --ref github-gate; that branch holds the real flow.

on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
        type: string
      head:
        required: true
        type: string
      checkpoint:
        required: false
        type: string

permissions: {}

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dispatch this workflow with --ref github-gate." && exit 1
